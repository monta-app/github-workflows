name: Deploy
on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
        description: 'stage being released (dev,staging,production)'
      service-name:
        required: true
        type: string
        description: 'Proper name for your service i.e OCPP Service, Vehicle Service'
      service-emoji:
        required: true
        type: string
        description: 'An emoji to identify your service by :)'
      service-identifier:
        required: true
        type: string
        description: 'Identifier of the service being released i.e ocpp, vehicle, server, wallet.'
      image-tag:
        required: true
        type: string
        description: 'Docker image tag to deploy'
      sentry-release:
        required: false
        type: string
        default: ''
        description: "Sentry release to write into the values' existing 'sentryRelease' key (kotlin chart >= 1.36.0). Empty leaves the values as before. The key is only rewritten, never added: older chart schemas reject unknown keys."
      release-tag:
        required: false
        type: string
        default: ''
        description: "Release tag this deploy will create, written as 'releaseTag' into the app's cluster/config.yaml so ArgoCD's app-production ApplicationSet can show it under Info. Empty leaves config.yaml as before."
      argocd-server:
        required: false
        type: string
        description: 'ArgoCD server URL (e.g., argocd.monta.app) for deployment monitoring'
      argocd-sync-wait-seconds:
        required: false
        default: 300
        type: number
        description: 'Timeout duration in seconds to wait for ArgoCD sync to apply'
      wait-for-argocd-sync:
        required: false
        type: boolean
        default: true
        description: 'Whether to block the workflow on ArgoCD sync becoming healthy. Set to false to fire-and-forget the deployment (the manifest commit still happens; only the wait step is skipped).'
    secrets:
      MANIFEST_REPO_PAT:
        required: true
        description: 'GitHub personal access token'
      ARGOCD_TOKEN:
        required: false
        description: 'ArgoCD authentication token (required if auto-sync is enabled in config.yaml)'
    outputs:
      stage:
        description: 'Stage this was deployed to (dev,staging,production)'
        value: ${{ jobs.deploy.outputs.stage }}
      docker-image:
        description: 'Docker image with repository'
        value: ${{ jobs.deploy.outputs.docker-image }}
      previous-image-tag:
        description: 'Docker image tag before the release'
        value: ${{ jobs.deploy.outputs.previous-image-tag }}
      image-tag:
        description: 'Docker image tag that was deployed'
        value: ${{ jobs.deploy.outputs.image-tag }}
      deployment-start-time:
        description: 'ISO 8601 timestamp when ArgoCD started the sync (only if auto-sync enabled)'
        value: ${{ jobs.deploy.outputs.deployment-start-time }}
      deployment-end-time:
        description: 'ISO 8601 timestamp when deployment became healthy (only if auto-sync enabled)'
        value: ${{ jobs.deploy.outputs.deployment-end-time }}
      deployment-url:
        description: 'Direct URL to the application in ArgoCD UI (only if auto-sync enabled)'
        value: ${{ jobs.deploy.outputs.deployment-url }}

permissions:
  contents: read
  id-token: write # OIDC token for the deploy token (deployer-token action)

jobs:
  deploy:
    name: Deploy
    env:
      SENTRY_RELEASE: ${{ inputs.sentry-release }}
      RELEASE_TAG: ${{ inputs.release-tag }}
    runs-on: ${{ github.event.repository.private && 'arc-arm64-1cpu-2gb-nodocker' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 20
    outputs:
      stage: ${{ inputs.stage }}
      docker-image: ${{ steps.update-image-tag.outputs.docker-image }}
      previous-image-tag: ${{ steps.update-image-tag.outputs.previous-image-tag }}
      image-tag: ${{ inputs.image-tag }}
      deployment-start-time: ${{ steps.argocd-sync.outputs.deployment-start-time }}
      deployment-end-time: ${{ steps.argocd-sync.outputs.deployment-end-time }}
      deployment-url: ${{ steps.deployment-url.outputs.url }}
    steps:
      - name: Check inputs
        shell: bash
        env:
          SERVICE_IDENTIFIER: ${{ inputs.service-identifier }}
          STAGE: ${{ inputs.stage }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          # These inputs end up in paths, sed expressions and shell commands below, in a job that holds a token
          # that can push to the deploy repo: refuse anything but plain names before the token is fetched.
          fail=0
          check() { [[ "$2" =~ $3 ]] || { echo "::error::$1 '$2' doesn't match $3"; fail=1; }; }
          check service-identifier "$SERVICE_IDENTIFIER" '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          check stage "$STAGE" '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          check image-tag "$IMAGE_TAG" '^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$'
          exit $fail
      - name: Get deploy token
        id: deploy-token
        uses: monta-app/github-workflows/.github/actions/deployer-token@main
        with:
          broker-url: ${{ vars.DEPLOY_TOKEN_BROKER_URL }}
          repository: kube-manifests
          fallback-token: ${{ secrets.MANIFEST_REPO_PAT }}
      - name: Check out manifest repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: monta-app/kube-manifests
          path: 'manifests'
          token: ${{ steps.deploy-token.outputs.token }}
      - name: Update image tag
        id: update-image-tag
        shell: bash
        working-directory: ./manifests/apps/${{ inputs.service-identifier }}/${{ inputs.stage }}/app
        run: |
          # Writes the Sentry release into an existing sentryRelease line only, never adds one:
          # kotlin chart schemas before 1.36.0 reject unknown keys, which would fail the ArgoCD sync.
          set_sentry_release() {
            if [[ -z "$SENTRY_RELEASE" ]]; then
              return 0
            fi
            if [[ ! "$SENTRY_RELEASE" =~ ^[A-Za-z0-9._+-]+$ ]]; then
              echo "::warning::sentry-release '$SENTRY_RELEASE' has characters outside [A-Za-z0-9._+-]; leaving sentryRelease as it is."
              return 0
            fi
            if grep -qE '^[[:space:]]*sentryRelease:' "$1"; then
              sed -i -E "s/^([[:space:]]*)sentryRelease:.*/\1sentryRelease: \"${SENTRY_RELEASE}\"/" "$1"
            else
              echo "::warning::sentry-release is set but $1 has no sentryRelease key. Add sentryRelease next to build once the app is on kotlin chart 1.36.0 or newer."
            fi
          }
          declare -f set_sentry_release > "$RUNNER_TEMP/set-sentry-release.sh"

          echo "docker-image=$(yq .kotlin.image.repository values.yaml)" >> "$GITHUB_OUTPUT"
          echo "previous-image-tag=$(yq .kotlin.image.tag values.yaml)" >> "$GITHUB_OUTPUT"

          sed -i "s/tag: .*/tag: ${{ inputs.image-tag }}/" values.yaml
          sed -i "s/revision: .*/revision: \"${GITHUB_SHA::8}\"/" values.yaml
          sed -i "s/build: .*/build: ${{ github.run_number }}/" values.yaml
          set_sentry_release values.yaml
      - name: Update config
        shell: bash
        working-directory: ./manifests/apps/${{ inputs.service-identifier }}/${{ inputs.stage }}/cluster
        run: |
          # Writes the release tag ArgoCD shows under Info; only when the caller passes one.
          set_release_tag() {
            if [[ -z "$RELEASE_TAG" ]]; then
              return 0
            fi
            if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::warning::release-tag '$RELEASE_TAG' has characters outside [A-Za-z0-9._-]; leaving releaseTag as it is."
              return 0
            fi
            yq e '.releaseTag = strenv(RELEASE_TAG)' -i "$1"
          }
          declare -f set_release_tag > "$RUNNER_TEMP/set-release-tag.sh"

          # Update previousHash
          previousHash=$(yq e .currentHash config.yaml) yq e '.previousHash = strenv(previousHash)' -i config.yaml
          # Update currentHash
          currentHash=${GITHUB_SHA::8} yq e '.currentHash = strenv(currentHash)' -i config.yaml
          set_release_tag config.yaml
      - name: Detect ArgoCD auto-sync configuration
        id: detect-autosync
        shell: bash
        working-directory: ./manifests/apps/${{ inputs.service-identifier }}/${{ inputs.stage }}/cluster
        run: |
          # Opt-out model: auto-sync is on unless disableAutoSync is true
          if [ "$(yq e '.disableAutoSync // false' config.yaml)" = "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ ArgoCD auto-sync is disabled (disableAutoSync: true) for this application"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✓ ArgoCD auto-sync is enabled for this application"
          fi
      - name: Commit and push with automatic retry
        shell: bash
        working-directory: ./manifests
        env:
          APP_PATH: apps/${{ inputs.service-identifier }}/${{ inputs.stage }}/app
          CLUSTER_PATH: apps/${{ inputs.service-identifier }}/${{ inputs.stage }}/cluster
          GIT_USER_NAME: ${{ steps.deploy-token.outputs.git-user-name }}
          GIT_USER_EMAIL: ${{ steps.deploy-token.outputs.git-user-email }}
        run: |
          source "$RUNNER_TEMP/set-sentry-release.sh"
          source "$RUNNER_TEMP/set-release-tag.sh"
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"

          git add .
          git commit -m "Bump docker tag for ${{ inputs.service-identifier }} on ${{ inputs.stage }} to ${{ inputs.image-tag }}"

          for attempt in $(seq 1 10); do
            echo "Push attempt $attempt..."
            if git push origin main; then
              echo "Push successful after $attempt attempt(s)"
              exit 0
            fi
            echo "Push failed, rebasing and retrying..."
            git fetch origin main
            if git rebase origin/main; then
              echo "Rebase clean, retrying push..."
            else
              echo "Rebase conflict, re-applying changes on top of latest main..."
              git rebase --abort
              git reset --soft origin/main
              sed -i "s/tag: .*/tag: ${{ inputs.image-tag }}/" "$APP_PATH/values.yaml"
              sed -i "s/revision: .*/revision: \"${GITHUB_SHA::8}\"/" "$APP_PATH/values.yaml"
              sed -i "s/build: .*/build: ${{ github.run_number }}/" "$APP_PATH/values.yaml"
              set_sentry_release "$APP_PATH/values.yaml"
              previousHash=$(yq e .currentHash "$CLUSTER_PATH/config.yaml") yq e '.previousHash = strenv(previousHash)' -i "$CLUSTER_PATH/config.yaml"
              currentHash=${GITHUB_SHA::8} yq e '.currentHash = strenv(currentHash)' -i "$CLUSTER_PATH/config.yaml"
              set_release_tag "$CLUSTER_PATH/config.yaml"
              git add .
              git commit -m "Bump docker tag for ${{ inputs.service-identifier }} on ${{ inputs.stage }} to ${{ inputs.image-tag }}"
            fi
            sleep 2
          done
          echo "Failed after 10 attempts"
          exit 1
      - name: Get manifest commit SHA
        id: manifest-sha
        shell: bash
        working-directory: './manifests'
        run: |
          MANIFEST_SHA=$(git rev-parse HEAD)
          echo "sha=$MANIFEST_SHA" >> "$GITHUB_OUTPUT"
          echo "Manifest commit SHA: $MANIFEST_SHA"
      - name: Check ArgoCD credentials
        id: check-argocd-creds
        shell: bash
        env:
          ARGOCD_SERVER: ${{ inputs.argocd-server }}
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          if [ -n "$ARGOCD_SERVER" ] && [ -n "$ARGOCD_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Log ArgoCD sync skip
        if: ${{ inputs.wait-for-argocd-sync == false || steps.detect-autosync.outputs.enabled == 'false' || steps.check-argocd-creds.outputs.available == 'false' }}
        shell: bash
        run: |
          if [ "${{ inputs.wait-for-argocd-sync }}" = "false" ]; then
            echo "⏭️ Skipping ArgoCD sync monitoring - wait-for-argocd-sync input set to false"
          elif [ "${{ steps.detect-autosync.outputs.enabled }}" = "false" ]; then
            echo "⏭️ Skipping ArgoCD sync monitoring - auto-sync is not configured for this application"
          else
            echo "⏭️ Skipping ArgoCD sync monitoring - argocd-server input or ARGOCD_TOKEN secret not provided"
          fi
      - name: Wait for ArgoCD sync
        if: ${{ inputs.wait-for-argocd-sync && steps.detect-autosync.outputs.enabled == 'true' && steps.check-argocd-creds.outputs.available == 'true' }}
        id: argocd-sync
        uses: monta-app/github-workflows/.github/actions/argocd-wait-sync@main
        with:
          server: ${{ inputs.argocd-server }}
          app-name: ${{ inputs.service-identifier }}-${{ inputs.stage }}
          auth-token: ${{ secrets.ARGOCD_TOKEN }}
          revision: ${{ steps.manifest-sha.outputs.sha }}
          timeout: ${{ inputs.argocd-sync-wait-seconds }}
          github-token: ${{ steps.deploy-token.outputs.token }}
      - name: Resolve deployment URL
        id: deployment-url
        if: ${{ inputs.argocd-server != '' }}
        shell: bash
        env:
          WAIT_URL: ${{ steps.argocd-sync.outputs.deployment-url }}
          SERVER: ${{ inputs.argocd-server }}
          APP: ${{ inputs.service-identifier }}-${{ inputs.stage }}
        run: |
          url="$WAIT_URL"
          if [ -z "$url" ]; then
            url="https://${SERVER}/applications/argocd/${APP}"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
