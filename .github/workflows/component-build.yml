name: Build
on:
  workflow_call:
    inputs:
      runner-size:
        required: false
        type: string
        default: 'normal'
        description: 'Runner size (normal or large)'
      use-arc-runners:
        required: false
        type: boolean
        default: true
        description: "Run on the self-hosted ARC arm64 runners (default in private repositories, never used in public ones)."
      stage:
        required: true
        type: string
        description: 'stage being released (dev,staging,production)'
      service-name:
        required: true
        type: string
        description: 'Proper name for your service i.e OCPP Service, Vehicle Service'
      service-emoji:
        required: true
        type: string
        description: 'An emoji to identify your service by :)'
      service-identifier:
        required: true
        type: string
        description: 'Identifier of the service being released i.e ocpp, vehicle, server, wallet.'
      region:
        required: false
        type: string
        default: "eu-west-1"
        description: 'AWS region to deploy to (defaults to "eu-west-1")'
      docker-file-name:
        required: false
        type: string
        description: Name of the docker file to be built
        default: "Dockerfile"
      additional-build-args:
        required: false
        type: string
        description: "Optional additional build arguments to pass to the Docker build process. Specify each argument on a new line in the format KEY=VALUE."
      ecr-repository-name:
        required: false
        type: string
        description: 'Custom ECR repository name. If not specified, defaults to service-identifier'
      git-sha:
        required: false
        type: string
        description: 'Git SHA to checkout and build from. Defaults to the triggering commit SHA.'
      prebuilt-artifact:
        required: false
        type: string
        default: ''
        description: "Name of an artifact an earlier job in the run uploaded, downloaded into the root of the build context before the Docker build, such as a binary compiled on the runner. Artifacts don't keep file modes, so the Dockerfile should COPY it with --chmod."
      dockerfile-cache-mounts:
        required: false
        type: boolean
        default: true
        description: "Restore and save the Dockerfile's RUN --mount=type=cache contents on ARC. Turn it off when the build skips the stages that use them, such as with a prebuilt-artifact."
    secrets:
      AWS_ACCOUNT_ID:
        required: true
        description: 'AWS account id'
      GHL_USERNAME:
        required: false
        description: 'Github Username (Required for Kotlin builds)'
      GHL_PASSWORD:
        required: false
        description: 'Github Password (Required for Kotlin builds)'
      SENTRY_AUTH_TOKEN:
        required: false
        description: "Sentry Auth Token, this value is injected into the secrets of a docker image"
      FARO_API_KEY:
        required: false
        description: "Grafana Faro API key for source-map upload, this value is injected into the secrets of a docker image"
      AWS_CDN_ACCESS_KEY_ID:
        required: false
        description: "AWS CDN Secret Access ID, this value is injected into the secrets of a docker image"
      AWS_CDN_SECRET_ACCESS_KEY:
        required: false
        description: "AWS CDN Secret Access Key, this value is injected into the secrets of a docker image"
      LOKALISE_TOKEN:
        required: false
        description: 'Lokalise token for Lokalise API, this value is injected into the secrets of a docker image'
      LOKALISE_PROJECT_ID:
        required: false
        description: 'Lokalise project ID for Lokalise API, this value is injected into the secrets of a docker image'
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:
        required: false
        description: 'Encryption key for Next.js Server Actions, this value is injected into the secrets of a docker image'
      GH_ACTION_ACCESS_KEY_ID:
        required: false
        description: "AWS access key for the S3 cache bucket, used on ARC. Without it ARC builds use the GitHub cache."
      GH_ACTION_SECRET_ACCESS_KEY:
        required: false
        description: "AWS secret key for the S3 cache bucket, used on ARC. Without it ARC builds use the GitHub cache."
    outputs:
      image-tag:
        description: 'The image tag that was built'
        value: ${{ jobs.setup.outputs.image-tag }}

permissions:
  id-token: write
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ${{ (inputs.use-arc-runners && github.event.repository.private) && 'arc-arm64-1cpu-2gb-nodocker' || 'linux-arm64' }}
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.runner.outputs.runner-name }}
      image-tag: ${{ inputs.git-sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.git-sha || github.sha }}
      - name: Get runner name
        id: runner
        uses: monta-app/github-workflows/.github/actions/runner-size-converter@main
        with:
          runner-size: ${{ inputs.runner-size }}
          use-arc-runners: ${{ (inputs.use-arc-runners && github.event.repository.private) }}

  build-self-hosted:
    name: Build (self-hosted)
    needs: setup
    runs-on: ${{ needs.setup.outputs.runner }}
    timeout-minutes: 30
    env:
      S3_CACHE: ${{ (inputs.use-arc-runners && github.event.repository.private) && secrets.GH_ACTION_ACCESS_KEY_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.git-sha || github.sha }}
      - name: Download prebuilt artifact
        if: ${{ inputs.prebuilt-artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.prebuilt-artifact }}
      - name: Configure AWS credentials via assumed role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecr-put-image
          role-session-name: push-new-image-to-${{ inputs.service-identifier }}-${{inputs.stage}}
          aws-region: ${{ inputs.region }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository-name || format('{0}-{1}', inputs.service-identifier, inputs.stage) }}
          tags: |
            type=raw,value=${{ inputs.git-sha || github.sha }}
            type=raw,value=latest
      # registry cache export needs the docker-container buildx driver (the default
      # docker driver does not support cache-to).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - name: Restore Dockerfile cache mounts
        id: cache-mounts
        if: ${{ (inputs.use-arc-runners && github.event.repository.private) && inputs.dockerfile-cache-mounts && env.S3_CACHE != 'true' }}
        # GitHub scopes caches by ref, so a pull request's cache never reaches the default branch's builds; poisoning
        # this cache already takes code running on the caller's default branch.
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5 # zizmor: ignore[cache-poisoning]
        with: &cache-mounts
          path: ${{ runner.temp }}/buildkit-cache-mounts
          key: buildkit-cache-mounts-${{ inputs.docker-file-name }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock', '**/bun.lock', '**/bun.lockb', '**/requirements*.txt', '**/poetry.lock', '**/uv.lock', '**/go.sum', '**/Cargo.lock') }}
          restore-keys: |
            buildkit-cache-mounts-${{ inputs.docker-file-name }}-
      - name: Restore Dockerfile cache mounts (S3)
        id: cache-mounts-s3
        if: ${{ inputs.dockerfile-cache-mounts && env.S3_CACHE == 'true' }}
        uses: runs-on/cache@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env:
          RUNS_ON_S3_BUCKET_CACHE: monta-github-ci-cache
          RUNS_ON_RUNNER_NAME: ""
          AWS_ACCESS_KEY_ID: ${{ secrets.GH_ACTION_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GH_ACTION_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ""
          AWS_REGION: eu-west-1
        with: *cache-mounts
      - name: Inject Dockerfile cache mounts into the builder
        if: ${{ (inputs.use-arc-runners && github.event.repository.private) && inputs.dockerfile-cache-mounts }}
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          dockerfile: ${{ inputs.docker-file-name }}
          cache-dir: ${{ runner.temp }}/buildkit-cache-mounts
          scratch-dir: ${{ runner.temp }}/buildkit-cache-dance-scratch
          skip-extraction: ${{ steps.cache-mounts.outputs.cache-hit || steps.cache-mounts-s3.outputs.cache-hit }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        with:
          context: .
          file: ./${{ inputs.docker-file-name }}
          push: true
          platforms: linux/arm64
          # provenance/sbom off (with BUILDX_NO_DEFAULT_ATTESTATIONS=1 above) so the
          # pushed tag is a plain single-arch image, not a manifest list.
          provenance: false
          sbom: false
          # Registry-backed BuildKit cache (mode=max) in the same ECR repo, covered by
          # the existing ecr-put-image IAM permissions.
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository-name || format('{0}-{1}', inputs.service-identifier, inputs.stage) }}:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository-name || format('{0}-{1}', inputs.service-identifier, inputs.stage) }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          build-args: |
            ${{ inputs.additional-build-args }}
          labels: |
            GITHUB_RUN_ID=${{ github.run_id }}
            ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          secrets: |
            ${{ secrets.GHL_USERNAME && format('GHL_USERNAME={0}', secrets.GHL_USERNAME) || '' }}
            ${{ secrets.GHL_PASSWORD && format('GHL_PASSWORD={0}', secrets.GHL_PASSWORD) || '' }}
            ${{ secrets.SENTRY_AUTH_TOKEN && format('SENTRY_AUTH_TOKEN={0}', secrets.SENTRY_AUTH_TOKEN) || '' }}
            ${{ secrets.FARO_API_KEY && format('FARO_API_KEY={0}', secrets.FARO_API_KEY) || '' }}
            ${{ secrets.AWS_CDN_ACCESS_KEY_ID && format('AWS_CDN_ACCESS_KEY_ID={0}', secrets.AWS_CDN_ACCESS_KEY_ID) || '' }}
            ${{ secrets.AWS_CDN_SECRET_ACCESS_KEY && format('AWS_CDN_SECRET_ACCESS_KEY={0}', secrets.AWS_CDN_SECRET_ACCESS_KEY) || '' }}
            ${{ secrets.LOKALISE_TOKEN && format('LOKALISE_TOKEN={0}', secrets.LOKALISE_TOKEN) || '' }}
            ${{ secrets.LOKALISE_PROJECT_ID && format('LOKALISE_PROJECT_ID={0}', secrets.LOKALISE_PROJECT_ID) || '' }}
            ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY && format('NEXT_SERVER_ACTIONS_ENCRYPTION_KEY={0}', secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY) || '' }}
