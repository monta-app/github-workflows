name: Gradle Dependency Submission
on:
  workflow_call:
    inputs:
      runner-size:
        required: false
        type: string
        description: "Runner to use for the job (normal, or large)"
        default: "normal"
      use-arc-runners:
        required: false
        type: boolean
        default: true
        description: "Run on the self-hosted ARC arm64 runners (default). Never used in public repositories: the ARC runner group rejects them, so they keep the GitHub-hosted runners. The Gradle cache is restored from S3 when the GH_ACTION_ACCESS_KEY_ID and GH_ACTION_SECRET_ACCESS_KEY secrets are passed (GitHub cache otherwise). Set to false to run on the GitHub-hosted linux-arm64 runners."
      java-version:
        required: false
        type: string
        default: '21'
      dependency-development-configurations:
        required: false
        type: string
        default: '.*[Tt]est.*|classpath|kapt.*|ksp.*|.*[Aa]nnotationProcessor|detekt.*|ktlint.*|kover.*'
        description: "Regular expression for the Gradle configurations whose dependencies are scoped 'development': tests and build tooling by default. A dependency also resolved by any other configuration is scoped 'runtime'."
      best-effort:
        required: false
        type: boolean
        default: false
        description: "When true, a failure to generate or submit the graph doesn't fail the job."
      build-root-directory:
        required: false
        type: string
        default: ''
        description: "Folder of the Gradle build, relative to the repository root. Defaults to the repository root."
    secrets:
      GH_ACTION_ACCESS_KEY_ID:
        required: false
        description: "AWS access key for the S3 cache bucket, used on ARC. Without it ARC jobs use the GitHub cache."
      GH_ACTION_SECRET_ACCESS_KEY:
        required: false
        description: "AWS secret key for the S3 cache bucket, used on ARC. Without it ARC jobs use the GitHub cache."
      GHL_USERNAME:
        required: false
        description: "Github Username (Gradle plugin), for builds that resolve packages from GitHub Packages"
      GHL_PASSWORD:
        required: false
        description: "Github Password (Gradle plugin), for builds that resolve packages from GitHub Packages"
env:
  LC_ALL: ${{ (inputs.use-arc-runners && github.event.repository.private) && 'C.UTF-8' || '' }}
  S3_CACHE: ${{ (inputs.use-arc-runners && github.event.repository.private) && secrets.GH_ACTION_ACCESS_KEY_ID != '' }}
jobs:
  setup:
    name: Setup
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ${{ (inputs.use-arc-runners && github.event.repository.private) && 'arc-arm64-1cpu-2gb-nodocker' || 'linux-arm64' }}
    outputs:
      runner-name: ${{ steps.runner.outputs.runner-name }}
    steps:
      - name: Get runner name
        id: runner
        uses: monta-app/github-workflows/.github/actions/runner-size-converter@main
        with:
          runner-size: ${{ inputs.runner-size }}
          use-arc-runners: ${{ (inputs.use-arc-runners && github.event.repository.private) }}
  submit:
    name: Submit Gradle dependencies
    needs: setup
    runs-on: ${{ needs.setup.outputs.runner-name }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: corretto
          java-version: ${{ inputs.java-version }}
      # Restore only: the build jobs on the default branch save this cache.
      - name: Restore Gradle cache
        if: ${{ env.S3_CACHE != 'true' }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with: &gradle-cache-restore
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-main-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-main-
      - name: Restore Gradle cache (S3)
        if: ${{ env.S3_CACHE == 'true' }}
        uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env:
          RUNS_ON_S3_BUCKET_CACHE: monta-github-ci-cache
          RUNS_ON_RUNNER_NAME: ""
          AWS_ACCESS_KEY_ID: ${{ secrets.GH_ACTION_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GH_ACTION_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-west-1
        with: *gradle-cache-restore
      - name: Generate Gradle dependency graph
        id: dependency-graph
        continue-on-error: ${{ inputs.best-effort }}
        env:
          GHL_USERNAME: ${{ secrets.GHL_USERNAME }}
          GHL_PASSWORD: ${{ secrets.GHL_PASSWORD }}
          DEPENDENCY_GRAPH_RUNTIME_EXCLUDE_CONFIGURATIONS: ${{ inputs.dependency-development-configurations }}
          # Names the snapshot and its artifact the same in every repo, rather
          # than after the calling workflow and job, so readers can fetch
          # dependency-graph_gradle-dependency-submission.json by name.
          GITHUB_DEPENDENCY_GRAPH_JOB_CORRELATOR: gradle-dependency-submission
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: generate-and-upload
          build-root-directory: ${{ inputs.build-root-directory }}
          # The job restores the Gradle cache itself.
          cache-provider: external
          artifact-retention-days: 30
      # A package resolved anywhere but Maven Central itself carries its
      # repository as a repository_url qualifier, so one resolved through a
      # proxy of Maven Central (as on the ARC runners) isn't matched to Maven
      # Central: GitHub then has no license or advisory data for it. Only
      # GitHub Packages addresses are kept, to tell those packages apart.
      - name: Submit Gradle dependency graph
        if: ${{ steps.dependency-graph.outcome == 'success' }}
        continue-on-error: ${{ inputs.best-effort }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for report in dependency-graph-reports/*.json; do
            jq '(.manifests[].resolved[].package_url) |= (if test("repository_url=https%3A%2F%2Fmaven\\.pkg\\.github\\.com") then . else sub("\\?repository_url=[^#]*$"; "") end)' \
              "$report" > "$report.submit"
            curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @"$report.submit" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dependency-graph/snapshots"
            echo
          done
