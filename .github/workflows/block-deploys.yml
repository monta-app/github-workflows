name: Block deploys

on:
  workflow_call:
    inputs:
      workflow:
        required: true
        type: string
        description: 'Workflow (filename or name) to block, e.g. "deploy-production.yml".'
    secrets:
      ADMIN_PAT:
        required: false # unused: the deploy lock uses GITHUB_TOKEN; kept so callers that pass it keep working
        description: 'GitHub PAT to update workflows'

permissions:
  actions: write # write: disable, enable and cancel the caller repo's deploy workflow with GITHUB_TOKEN
  contents: read
  id-token: write

jobs:
  disable-deploy-flows:
    name: Disable and cancel deploy
    runs-on: ${{ github.event.repository.private && 'arc-arm64-1cpu-2gb-nodocker' || 'ubuntu-24.04-arm' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Disable CD on merge to main
      - name: Disable ${{ inputs.workflow }} workflow
        run: gh workflow disable "$WORKFLOW" || true
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ inputs.workflow }}

      # Cancel queued, in-progress, requested, pending or waiting deploy jobs
      - name: Cancel ${{ inputs.workflow }} jobs
        run: |
          for runId in $(gh run list -w "$WORKFLOW" -a --json databaseId,status -q '.[] | select(.status == "queued" or .status == "in_progress" or .status == "requested" or .status == "waiting" or .status == "pending") | .databaseId'); do
            echo "Cancelling $WORKFLOW job: $runId";
            gh run cancel "$runId" || echo "Could not cancel job $runId. Status might have just changed." ;
          done
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ inputs.workflow }}
