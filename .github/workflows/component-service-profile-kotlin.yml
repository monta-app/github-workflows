name: Update service profile
on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
        description: 'stage being released (dev,staging,production)'
      service-identifier:
        required: true
        type: string
        description: 'Identifier of the service being released i.e ocpp, vehicle, server, wallet.'
      gradle-module:
        required: false
        type: string
        description: 'Name of the gradle module being tested'
      java-version:
        required: false
        type: string
        default: "21"
        description: 'Java version to use'
      file-name:
        required: false
        default: 'service-profile.yml'
        type: string
        description: 'File name for the service profile in the `templates` directory'
      openapi-max-workers:
        required: false
        type: string
        default: ''
        description: |
          Optional cap on Gradle parallelism for the OpenAPI build step.
          Each kapt worker uses ~4GB heap; on multi-module repos the
          default parallelism (Runtime.availableProcessors()) can OOM the
          runner. Set to e.g. "2" to cap concurrent kapt JVMs. Empty
          string keeps the default behavior unchanged.
      use-arc-runners:
        required: false
        type: boolean
        default: false
        description: "Run on the self-hosted ARC arm64 runners."
      image-tag:
        required: false
        type: string
        default: ''
        description: |
          Tag of the image that was just deployed. With ecr-repository-name and the AWS_ACCOUNT_ID secret, the
          OpenAPI spec is read from that image and the Gradle build is skipped. When the image doesn't hold exactly
          one META-INF/swagger/*.yml, or it can't be read, the spec is built with Gradle as before.
      ecr-repository-name:
        required: false
        type: string
        default: ''
        description: 'ECR repository of the image in image-tag'
      region:
        required: false
        type: string
        default: "eu-west-1"
        description: 'AWS region of the ECR repository'
    secrets:
      AWS_ACCOUNT_ID:
        required: false
        description: 'AWS account id of the ECR repository in ecr-repository-name'
      GHL_USERNAME:
        required: false
        description: 'Github Username (Required for Kotlin builds)'
      GHL_PASSWORD:
        required: false
        description: 'Github Password (Required for Kotlin builds)'
      MANIFEST_REPO_PAT:
        required: true
        description: 'GitHub personal access token'

env:
  # The ARC runner image defaults to a POSIX locale.
  LC_ALL: ${{ inputs.use-arc-runners && 'C.UTF-8' || '' }}

jobs:
  update-service-profile:
    name: Update service profile
    runs-on: ${{ inputs.use-arc-runners && 'arc-arm64-4cpu-12gb' || 'linux-arm64' }}
    steps:
      - name: Check for an image to read the OpenAPI spec from
        id: image
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
          ECR_REPOSITORY_NAME: ${{ inputs.ecr-repository-name }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          if [[ -n "$IMAGE_TAG" && -n "$ECR_REPOSITORY_NAME" && -n "$AWS_ACCOUNT_ID" ]]; then
            echo "use=true" >> "$GITHUB_OUTPUT"
          else
            echo "OpenAPI spec: building with Gradle, no image-tag, ecr-repository-name or AWS_ACCOUNT_ID was passed"
          fi
      # The image path is only a shortcut: any failure in it leaves the spec empty, and the Gradle steps below run.
      - name: Configure AWS credentials via assumed role
        id: aws
        if: steps.image.outputs.use == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecr-put-image
          role-session-name: service-profile-${{ inputs.service-identifier }}-${{ inputs.stage }}
          aws-region: ${{ inputs.region }}
      - name: Login to Amazon ECR
        id: login-ecr
        if: steps.aws.outcome == 'success'
        continue-on-error: true
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2
      - name: Read OpenAPI spec from the image
        id: image-spec
        if: steps.image.outputs.use == 'true'
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          LOGIN_OUTCOME: ${{ steps.login-ecr.outcome }}
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository-name }}:${{ inputs.image-tag }}
        run: |
          fallback() {
            echo "::notice::OpenAPI spec: building with Gradle, $1"
            exit 0
          }

          if [[ "$LOGIN_OUTCOME" != "success" ]]; then
            fallback "the AWS or ECR login didn't succeed"
          fi
          if ! command -v docker >/dev/null || ! command -v unzip >/dev/null; then
            fallback "docker or unzip isn't installed on this runner"
          fi
          if ! docker pull --quiet "$IMAGE" >/dev/null; then
            fallback "$IMAGE couldn't be pulled"
          fi

          # Only the app's own files are searched, not the base image's (JDK and OS).
          WORK_DIR=$(docker image inspect --format '{{.Config.WorkingDir}}' "$IMAGE" || true)
          if [[ -z "$WORK_DIR" || "$WORK_DIR" == "/" ]]; then
            fallback "$IMAGE sets no working directory to search"
          fi
          APP_DIR="$RUNNER_TEMP/image-app"
          if ! CONTAINER=$(docker create "$IMAGE"); then
            fallback "no container could be created from $IMAGE"
          fi
          copied=true
          docker cp "$CONTAINER:$WORK_DIR/." "$APP_DIR" || copied=false
          docker rm "$CONTAINER" >/dev/null || true
          if [[ "$copied" != "true" ]]; then
            fallback "$WORK_DIR couldn't be copied out of $IMAGE"
          fi

          # kapt puts the spec in the app's classes and KSP in its resources: a jar, or a loose resources directory.
          found=()
          while IFS= read -r -d '' file; do
            if [[ "$(dirname "$file")" == */META-INF/swagger ]]; then
              found+=("$file")
              spec_file="$file"
              spec_jar=""
            fi
          done < <(find "$APP_DIR" -type f -path '*/META-INF/swagger/*.yml' -print0)
          while IFS= read -r -d '' jar; do
            while IFS= read -r entry; do
              found+=("${jar}!/${entry}")
              spec_jar="$jar"
              spec_entry="$entry"
            done < <(unzip -Z1 "$jar" 2>/dev/null | grep -E '^META-INF/swagger/[^/]+\.yml$')
          done < <(find "$APP_DIR" -type f -name '*.jar' -print0)

          if [[ ${#found[@]} -eq 0 ]]; then
            fallback "$IMAGE has no META-INF/swagger/*.yml under $WORK_DIR"
          fi
          if [[ ${#found[@]} -gt 1 ]]; then
            fallback "$IMAGE has ${#found[@]} specs under $WORK_DIR: ${found[*]#"$APP_DIR"/}"
          fi

          SPEC="$RUNNER_TEMP/openapi-from-image.yml"
          if [[ -n "$spec_jar" ]]; then
            unzip -p "$spec_jar" "$spec_entry" > "$SPEC"
          else
            cp "$spec_file" "$SPEC"
          fi
          if [[ ! -s "$SPEC" ]]; then
            fallback "${found[0]#"$APP_DIR"/} in $IMAGE is empty"
          fi
          echo "::notice::OpenAPI spec: read ${found[0]#"$APP_DIR"/} from $IMAGE, skipping the Gradle build"
          echo "spec=$SPEC" >> "$GITHUB_OUTPUT"
      - name: Checkout
        if: steps.image-spec.outputs.spec == ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up JDK
        if: steps.image-spec.outputs.spec == ''
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "corretto"
          java-version: ${{ inputs.java-version }}
          cache: 'gradle'
      - name: Install LinkerD CLI
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://run.linkerd.io/install | sh
          echo "/home/runner/.linkerd2/bin" >> "$GITHUB_PATH"
      - name: Install yq
        if: inputs.use-arc-runners
        shell: bash
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_arm64
          sudo chmod +x /usr/local/bin/yq
      - name: Discover annotation processor
        if: steps.image-spec.outputs.spec == ''
        shell: bash
        env:
          GHL_USERNAME: ${{ secrets.GHL_USERNAME }}
          GHL_PASSWORD: ${{ secrets.GHL_PASSWORD }}
          GRADLE_MODULE: ${{ inputs.gradle-module }}
        run: |
          GRADLE_TASK=$(./gradlew "${GRADLE_MODULE}":tasks --all | grep -E '(kaptKotlin|kspKotlin)' | head -n1)
          if [ "$GRADLE_TASK" = "kaptKotlin" ]; then
            OUTPUT_DIR="build/tmp/kapt3/classes/main/META-INF/swagger"
          elif [ "$GRADLE_TASK" = "kspKotlin" ]; then
            OUTPUT_DIR="build/generated/ksp/main/resources/META-INF/swagger"
          fi
          
          echo "GRADLE_TASK=${GRADLE_TASK}" >> "$GITHUB_ENV"
          if [ "$GRADLE_MODULE" = "" ]; then
            echo "OPENAPI_OUTPUT_DIR=${OUTPUT_DIR}" >> "$GITHUB_ENV"
          else
            echo "OPENAPI_OUTPUT_DIR=${GRADLE_MODULE}/${OUTPUT_DIR}" >> "$GITHUB_ENV"
          fi
      - name: Build OpenAPI spec
        if: steps.image-spec.outputs.spec == ''
        shell: bash
        env:
          GHL_USERNAME: ${{ secrets.GHL_USERNAME }}
          GHL_PASSWORD: ${{ secrets.GHL_PASSWORD }}
          OPENAPI_MAX_WORKERS: ${{ inputs.openapi-max-workers }}
        run: |
          if [ -n "$OPENAPI_MAX_WORKERS" ]; then
            ./gradlew --max-workers="$OPENAPI_MAX_WORKERS" "$GRADLE_TASK"
          else
            ./gradlew "$GRADLE_TASK"
          fi
      - name: Generate service profile
        shell: bash
        env:
          IMAGE_SPEC: ${{ steps.image-spec.outputs.spec }}
          SERVICE_IDENTIFIER: ${{ inputs.service-identifier }}
          STAGE: ${{ inputs.stage }}
        run: |
          # Find the generated spec
          YML_FILE="$IMAGE_SPEC"
          [ -n "$YML_FILE" ] || YML_FILE=$(find . -type f -name '*.yml' | grep "^\./${OPENAPI_OUTPUT_DIR}/" | head -n1 || true)
          [ -n "$YML_FILE" ] || YML_FILE=$(find . -type f -name '*.yml' | grep "$OPENAPI_OUTPUT_DIR" | head -n1)

          # Check if a .yml file was found and display the result or an error message
          if [ -z "${YML_FILE}" ]; then
              echo "No .yml file found in $OPENAPI_OUTPUT_DIR."
              exit 1
          fi
          
          SERVICE_NAME="${SERVICE_IDENTIFIER}-${STAGE}"

          linkerd profile --ignore-cluster -n "$SERVICE_NAME" --open-api "$YML_FILE" "$SERVICE_NAME" \
            | yq 'del(.spec.routes[].responseClasses)' \
            | yq 'del(.metadata.namespace)' \
            | yq 'del(.metadata.creationTimestamp)' \
            | yq '.spec.routes += [
              {"condition": {"method": "POST"}, "name": "POST [Default]"},
              {"condition": {"method": "GET"}, "name": "GET [Default]"},
              {"condition": {"method": "PATCH"}, "name": "PATCH [Default]"},
              {"condition": {"method": "PUT"}, "name": "PUT [Default]"},
              {"condition": {"method": "HEAD"}, "name": "HEAD [Default]"},
              {"condition": {"method": "OPTIONS"}, "name": "OPTIONS [Default]"}
            ]' > service-profile.yml
      # The caller's own build ran in this job, so the token that pushes to kube-manifests is fetched in a job of its
      # own, which gets only the generated file.
      - name: Upload service profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: service-profile-${{ inputs.service-identifier }}-${{ inputs.stage }}
          path: service-profile.yml
          retention-days: 1
          if-no-files-found: error

  push-service-profile:
    name: Push service profile
    needs: update-service-profile
    runs-on: ${{ (inputs.use-arc-runners && github.event.repository.private) && 'arc-arm64-1cpu-2gb-nodocker' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC token for the deploy token (deployer-token action)
    steps:
      - name: Check inputs
        shell: bash
        env:
          SERVICE_IDENTIFIER: ${{ inputs.service-identifier }}
          STAGE: ${{ inputs.stage }}
          FILE_NAME: ${{ inputs.file-name }}
        run: |
          # These inputs end up in paths and shell commands below, in a job that holds a token that can push to
          # kube-manifests: refuse anything but plain names before the token is fetched.
          fail=0
          check() { [[ "$2" =~ $3 ]] || { echo "::error::$1 '$2' doesn't match $3"; fail=1; }; }
          check service-identifier "$SERVICE_IDENTIFIER" '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          check stage "$STAGE" '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          check file-name "$FILE_NAME" '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          exit $fail
      - name: Download service profile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: service-profile-${{ inputs.service-identifier }}-${{ inputs.stage }}
      - name: Get deploy token
        id: deploy-token
        uses: monta-app/github-workflows/.github/actions/deployer-token@main
        with:
          broker-url: ${{ vars.DEPLOY_TOKEN_BROKER_URL }}
          repository: kube-manifests
          fallback-token: ${{ secrets.MANIFEST_REPO_PAT }}
      - name: Check out manifest repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: 'manifests'
          repository: monta-app/kube-manifests
          token: ${{ steps.deploy-token.outputs.token }}
      - name: Update or create manifest file
        shell: bash
        env:
          TEMPLATES_PATH: ./manifests/apps/${{ inputs.service-identifier }}/${{ inputs.stage }}/app/templates
          FILE_NAME: ${{ inputs.file-name }}
        run: |
          mkdir -p "$TEMPLATES_PATH"
          SERVICE_PROFILE_FILE="$TEMPLATES_PATH/$FILE_NAME"

          # Only update the routes part of the service profile if it already exists
          if [[ -f "$SERVICE_PROFILE_FILE" ]]; then
            yq -i '.spec.routes = load("service-profile.yml").spec.routes' "$SERVICE_PROFILE_FILE"
          else
            cp service-profile.yml "$SERVICE_PROFILE_FILE"
          fi

          # Add a note that the metadata can be updated
          echo "NOTE! .spec.routes is updated automatically. You can update metadata if the generated name 
          does not match your service name or you would like to add labels, annotations etc. You need to 
          ensure the file is still valid yaml (no Helm templating!)" > headComment.txt
          yq -i '. headComment=load("headComment.txt")' "$SERVICE_PROFILE_FILE"

          cat "$SERVICE_PROFILE_FILE"
      - name: Commit
        id: commit-changes
        shell: bash
        working-directory: ./manifests/apps/${{ inputs.service-identifier }}/${{ inputs.stage }}/app/templates
        env:
          FILE_NAME: ${{ inputs.file-name }}
          SERVICE_IDENTIFIER: ${{ inputs.service-identifier }}
          STAGE: ${{ inputs.stage }}
          GIT_USER_NAME: ${{ steps.deploy-token.outputs.git-user-name }}
          GIT_USER_EMAIL: ${{ steps.deploy-token.outputs.git-user-email }}
        run: |
          git add "$FILE_NAME"
          if [[ -n "$(git diff --exit-code HEAD)" ]]; then
            git config --local user.email "$GIT_USER_EMAIL"
            git config --local user.name "$GIT_USER_NAME"
            git commit -m "Updated $FILE_NAME for $SERVICE_IDENTIFIER on $STAGE"
            echo "Changes committed"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Push changes
        if: always() && steps.commit-changes.outputs.has_changes == 'true'
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # master
        with:
          directory: './manifests'
          github_token: ${{ steps.deploy-token.outputs.token }}
          repository: monta-app/kube-manifests
