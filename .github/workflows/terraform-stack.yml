name: Terraform Stack

# Plans or applies one Terraform stack. Called once per entry in the matrix
# emitted by terraform-discover.yml. See docs/workflow-guide.md.
#
# The caller's job must grant: contents: read, pull-requests: write,
# issues: write, and id-token: write when using an OIDC role. The stack's
# credentials must be able to read, write and delete objects under
# tfplans/<state key>/ in the state bucket (see below).

on:
  workflow_call:
    inputs:
      stack:
        description: Path to the stack directory (the one holding backend.tf).
        type: string
        required: true
      command:
        description: plan, apply, or recover (plan + apply in one run; the plan is not reviewed).
        type: string
        required: true
      environment:
        description: GitHub environment to run apply under. Ignored for plan.
        type: string
        default: ""
      aws-role:
        description: IAM role ARN to assume via OIDC. Leave empty to use the static key secrets.
        type: string
        default: ""
      aws-extra-role:
        description: >-
          Optional second IAM role ARN to assume via OIDC, for a stack that also works in another AWS account
          (for example a cross-account VPC peering). Its credentials are written to the AWS profile named by
          aws-extra-profile and never to the environment, so the primary role (aws-role or the static key) is
          untouched. The stack's provider selects them with `profile = "<aws-extra-profile>"`.
        type: string
        default: ""
      aws-extra-profile:
        description: Name of the AWS profile that gets the credentials of aws-extra-role. No whitespace, brackets or slashes.
        type: string
        default: extra
      aws-region:
        type: string
        default: eu-west-1
      aws-session-duration:
        description: Seconds the OIDC session lasts. Raise it for applies that run past an hour; the role's MaxSessionDuration must allow it.
        type: number
        default: 3600
      parallelism:
        description: Terraform -parallelism for plan and apply.
        type: number
        default: 10
      tailscale:
        description: Join the tailnet before init, for providers that reach private endpoints.
        type: boolean
        default: false
      terraform-version:
        description: Overrides .terraform-version in the stack directory or repository root.
        type: string
        default: ""
      runner:
        type: string
        default: linux-arm64
      dismiss-stale-approvals:
        description: On a pull request, dismiss approvals given on a commit whose plan for this stack differs from the new plan.
        type: boolean
        default: false
    secrets:
      aws-access-key-id:
        required: false
      aws-secret-access-key:
        required: false
      tf-vars-json:
        description: JSON object of Terraform variables, written to the stack as ci.auto.tfvars.json.
        required: false
      tailscale-authkey:
        description: Required when tailscale is true.
        required: false
      recovery-token:
        description: Token that can push branches and open pull requests here (a PAT or GitHub App token, not GITHUB_TOKEN, so the pull request gets planned). When set, a failed apply opens a recovery pull request.
        required: false

jobs:
  terraform:
    name: ${{ inputs.command }}
    runs-on: ${{ inputs.runner }}
    concurrency:
      group: tf-${{ inputs.stack }}-${{ inputs.command != 'plan' && 'apply' || github.ref }}
      cancel-in-progress: ${{ inputs.command == 'plan' }}
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.stack }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      STACK: ${{ inputs.stack }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve Terraform version
        id: tfver
        working-directory: .
        env:
          OVERRIDE: ${{ inputs.terraform-version }}
        run: |
          set -eu
          if   [ -n "$OVERRIDE" ];                     then v="$OVERRIDE"
          elif [ -f "$STACK/.terraform-version" ];     then v=$(cat "$STACK/.terraform-version")
          elif [ -f ".terraform-version" ];            then v=$(cat .terraform-version)
          else
            echo "::error title=No Terraform version::Add .terraform-version to $STACK or the repository root."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Terraform $v"

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        if: inputs.aws-role != ''
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ inputs.aws-role }}
          aws-region: ${{ inputs.aws-region }}
          role-duration-seconds: ${{ inputs.aws-session-duration }}

      - name: Configure AWS credentials via static keys
        if: inputs.aws-role == ''
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-access-key-id: ${{ secrets.aws-access-key-id }}
          aws-secret-access-key: ${{ secrets.aws-secret-access-key }}
          aws-region: ${{ inputs.aws-region }}

      # A second account for the stack. With aws-profile the action writes the credentials to
      # ~/.aws/credentials and does not export them (output-env-credentials defaults to false then),
      # so the credentials of the step above stay the ones in the environment, and the S3 backend and
      # the saved plan keep using them. Needs id-token: write, like the primary OIDC role.
      - name: Configure AWS credentials for the extra role
        if: inputs.aws-extra-role != ''
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ inputs.aws-extra-role }}
          aws-profile: ${{ inputs.aws-extra-profile }}
          aws-region: ${{ inputs.aws-region }}
          role-duration-seconds: ${{ inputs.aws-session-duration }}

      - name: Join the tailnet
        if: inputs.tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          authkey: ${{ secrets.tailscale-authkey }}
          hostname: github-${{ github.run_id }}
          args: "--login-server https://headscale.monta.com"

      - name: Write CI variables
        env:
          TF_VARS_JSON: ${{ secrets.tf-vars-json }}
        run: |
          set -eu
          if [ -n "${TF_VARS_JSON:-}" ]; then
            printf '%s' "$TF_VARS_JSON" > ci.auto.tfvars.json
            echo "Wrote ci.auto.tfvars.json"
          fi

      - name: Terraform init
        run: terraform init -input=false -lock-timeout=5m

      # The saved plan embeds the full prior state and every variable value, so it is
      # as secret as the state. It is kept in the state bucket, where only the state's
      # readers can get it - never as an Actions artifact, which anyone with read access
      # to the repository can download. One shared tfplans/ prefix lets a single bucket
      # lifecycle rule expire plans that are never applied.
      - name: Locate the plan store
        id: store
        if: inputs.command == 'plan' || inputs.command == 'apply'
        run: |
          set -eu
          backend=$(jq -c '.backend // empty' .terraform/terraform.tfstate)
          if [ "$(printf '%s' "$backend" | jq -r '.type // empty')" != "s3" ]; then
            echo "::error title=Unsupported backend::$STACK must use the s3 backend; the saved plan is stored beside the state."
            exit 1
          fi
          printf '%s' "$backend" | jq -r '
            "prefix=s3://" + .config.bucket + "/tfplans/" + .config.key,
            "region=" + (.config.region // "")' >> "$GITHUB_OUTPUT"

      - name: Terraform fmt
        if: inputs.command == 'plan'
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        if: inputs.command == 'plan' || inputs.command == 'recover'
        run: |
          set -eu
          terraform plan -no-color -input=false -lock-timeout=5m -parallelism=${{ inputs.parallelism }} \
            -out=tfplan -detailed-exitcode > plan.txt 2>&1 && code=0 || code=$?
          tail -c 400000 plan.txt
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "changes=false" >> "$GITHUB_OUTPUT"
               echo "failed=true"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Upload plan
        if: inputs.command == 'plan' && steps.plan.outputs.failed != 'true'
        env:
          URI: ${{ steps.store.outputs.prefix }}/${{ github.event.pull_request.head.sha || github.sha }}.tfplan
          AWS_REGION: ${{ steps.store.outputs.region || inputs.aws-region }}
        run: aws s3 cp --only-show-errors tfplan "$URI"

      - name: Fingerprint the planned changes
        id: fingerprint
        if: inputs.command == 'plan' && inputs.dismiss-stale-approvals && github.event_name == 'pull_request' && steps.plan.outputs.failed != 'true'
        run: |
          set -eu
          hash=$(terraform show -json tfplan | jq -cS '
            def mask($s):
              if $s == true then "(sensitive)"
              elif type == "object" and ($s | type) == "object" then with_entries(.key as $k | .value |= mask($s[$k] // false))
              elif type == "array" and ($s | type) == "array" then [range(0; length) as $i | .[$i] | mask($s[$i] // false)]
              else . end;
            [.resource_changes[]?
              | .change as $c
              | select($c.actions != ["no-op"] and $c.actions != ["read"])
              | {address, actions: $c.actions, after: ($c.after | mask($c.after_sensitive // false)),
                 after_unknown: $c.after_unknown, replace_paths: $c.replace_paths, importing: $c.importing}]
            | sort_by(.address)' | sha256sum | cut -d' ' -f1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Plan fingerprint: $hash"

      - name: Comment plan on the pull request
        if: inputs.command == 'plan' && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PLAN_FAILED: ${{ steps.plan.outputs.failed }}
          HAS_CHANGES: ${{ steps.plan.outputs.changes }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.hash }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo
            const stack = process.env.STACK
            const plan = fs.readFileSync(`${stack}/plan.txt`, 'utf8')

            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'terraform-failed', per_page: 100,
            })
            const stuck = open.data.find(i => i.title === `terraform apply failed: ${stack}`)
            const banner = stuck
              ? `> [!WARNING]\n> This stack has an **unresolved failed apply** (#${stuck.number}). The plan below may include leftover changes from it — check before merging.\n\n`
              : ''

            // Mirrors "Plan: [N to import, ]N to add, N to change, N to destroy."
            // with a colored, at-a-glance version, read from the full plan so it
            // survives the comment truncation below.
            let summary
            let destroyed = []
            if (process.env.PLAN_FAILED === 'true') {
              summary = '❌ Plan failed'
            } else if (process.env.HAS_CHANGES !== 'true') {
              summary = '🔵 No changes'
            } else {
              const counts = plan.match(/^Plan: (?:(\d+) to import, )?(\d+) to add, (\d+) to change, (\d+) to destroy\.$/m)
              if (counts) {
                const [toImport, toAdd, toChange, toDestroy] = counts.slice(1).map(n => Number(n ?? 0))
                summary = [
                  toImport  > 0 && `🔵 **${toImport} to import**`,
                  toAdd     > 0 && `🟢 **${toAdd} to add**`,
                  toChange  > 0 && `🟡 **${toChange} to change**`,
                  toDestroy > 0 && `🔴 **${toDestroy} to destroy**`,
                ].filter(Boolean).join('  ·  ') || 'Changes planned'
              } else {
                summary = 'Changes planned'
              }
              destroyed = [...plan.matchAll(/^\s+# (.+?) (will be destroyed|must be replaced)$/gm)]
                .map(([, addr, what]) => `- \`${addr}\`${what === 'must be replaced' ? ' (replaced)' : ''}`)
            }

            const shown = plan.split('\n')
              .filter(l => !/: (Refreshing state|Reading|Preparing import)\.\.\.|: Read complete after /.test(l))
              .join('\n')
            const LIMIT = 60000
            const body = [
              `<!-- terraform-plan:${stack} -->`,
              banner + `### Terraform plan — \`${stack}\``,
              '', `**${summary}**`, '',
              ...(destroyed.length ? ['> [!CAUTION]', '> **Destroyed or replaced:**', ...destroyed.map(d => `> ${d}`), ''] : []),
              '<details><summary>Show plan</summary>', '', '```terraform',
              shown.length > LIMIT
                ? shown.slice(0, LIMIT) + `\n\n... truncated (${shown.length} chars); see the run log.`
                : shown,
              '```', '</details>',
            ].join('\n')

            const marker = `<!-- terraform-plan:${stack} -->`
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: context.issue.number, per_page: 100,
            })
            const existing = comments.find(c => c.body.includes(marker))

            const fingerprint = process.env.FINGERPRINT
            const seen = new Map([...(existing?.body ?? '').matchAll(/^<!-- terraform-plan-fingerprint:(\w+):(\w+) -->$/gm)].map(m => [m[1], m[2]]))
            if (fingerprint) {
              seen.delete(process.env.HEAD_SHA)
              seen.set(process.env.HEAD_SHA, fingerprint)
            }
            const full = [body, ...[...seen].slice(-50).map(([sha, fp]) => `<!-- terraform-plan-fingerprint:${sha}:${fp} -->`)].join('\n')
            existing
              ? await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: full })
              : await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body: full })

            if (fingerprint) {
              const pull_number = context.issue.number
              const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number, per_page: 100 })
              const latest = new Map()
              for (const r of reviews) if (r.state !== 'COMMENTED' && r.state !== 'PENDING') latest.set(r.user.id, r)
              for (const r of latest.values()) {
                if (r.state !== 'APPROVED') continue
                const approved = seen.get(r.commit_id)
                if (approved === fingerprint) continue
                const message = approved
                  ? `The plan for ${stack} changed since this approval (${r.commit_id.slice(0, 7)}). Review the new plan and approve again.`
                  : `No plan for ${stack} was recorded on the approved commit (${r.commit_id.slice(0, 7)}), so this approval cannot be matched to the new plan. Review it and approve again.`
                await github.rest.pulls.dismissReview({ owner, repo, pull_number, review_id: r.id, message })
                core.notice(`Dismissed ${r.user.login}'s approval: ${message}`)
              }
            }

      - name: Fail on plan error
        if: steps.plan.outputs.failed == 'true'
        run: exit 1

      - name: Download the reviewed plan
        id: fetch
        if: inputs.command == 'apply'
        env:
          PREFIX: ${{ steps.store.outputs.prefix }}
          AWS_REGION: ${{ steps.store.outputs.region || inputs.aws-region }}
        run: |
          set -eu
          fetch() {
            err=$(aws s3 cp --only-show-errors "$1" tfplan 2>&1) && return 0
            case $err in *"(404)"*) return 1 ;; esac
            echo "::error title=Could not read the plan::$err"
            exit 1
          }
          uri="$PREFIX/${{ github.sha }}.tfplan"
          if ! fetch "$uri"; then
            head=$(gh api "/repos/$REPO/commits/${{ github.sha }}/pulls" --jq '.[0].head.sha // empty')
            uri="$PREFIX/$head.tfplan"
            if [ -z "$head" ] || ! fetch "$uri"; then
              echo "::error title=No reviewed plan::No saved plan for $STACK at ${{ github.sha }}. Dispatch the caller with command recover for this stack."
              exit 1
            fi
          fi
          echo "uri=$uri" >> "$GITHUB_OUTPUT"

      - name: Terraform apply
        id: apply
        if: inputs.command == 'apply' || inputs.command == 'recover'
        continue-on-error: true
        run: |
          set -o pipefail
          terraform apply -input=false -lock-timeout=5m -parallelism=${{ inputs.parallelism }} -no-color tfplan 2>&1 | tee apply.txt

      - name: Re-plan after a failed apply
        if: steps.apply.outcome == 'failure'
        run: terraform plan -no-color -input=false -lock-timeout=5m -parallelism=${{ inputs.parallelism }} > replan.txt 2>&1 || true

      - name: Open the recovery pull request
        id: recovery
        if: steps.apply.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.recovery-token }}
          BASE: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          [ -n "$GH_TOKEN" ] || exit 0
          branch="terraform-recover/$STACK"
          path="$STACK/recover.tf"
          url=$(gh pr list -R "$REPO" --head "$branch" --state open --json url -q '.[0].url')
          if [ -z "$url" ]; then
            base_sha=$(gh api "repos/$REPO/git/ref/heads/$BASE" -q .object.sha)
            gh api -X PATCH "repos/$REPO/git/refs/heads/$branch" -f sha="$base_sha" -F force=true > /dev/null 2>&1 \
              || gh api "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$base_sha" > /dev/null
          fi
          args=()
          if sha=$(gh api "repos/$REPO/contents/$path?ref=$branch" -q .sha 2> /dev/null); then args=(-f sha="$sha"); fi
          content=$(printf '# Changed by the Terraform workflow after a failed apply, so a pull request re-plans this stack.\n# %s\n' "$RUN_URL" | base64 -w0)
          gh api -X PUT "repos/$REPO/contents/$path" -f message="Recover $STACK after $RUN_URL" \
            -f content="$content" -f branch="$branch" "${args[@]}" > /dev/null
          if [ -z "$url" ]; then
            url=$(gh pr create -R "$REPO" --draft --base "$BASE" --head "$branch" \
              --title "Recover Terraform stack $STACK" \
              --body "The apply of \`$STACK\` failed: $RUN_URL. The plan on this pull request is what is left over. Fix the cause (here, or in Terraform's dependencies such as provider permissions), re-run this pull request's plan, review it and merge to apply it.")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Report the failed apply
        if: steps.apply.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          MERGER: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RECOVERY_PR: ${{ steps.recovery.outputs.url }}
        with:
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo
            const stack = process.env.STACK
            const { MERGER, RUN_URL, RECOVERY_PR } = process.env
            let plan = '(re-plan produced no output)'
            try { plan = fs.readFileSync(`${stack}/replan.txt`, 'utf8').slice(-40000) } catch (e) {}

            let started = true
            try { started = /^\S+: (Creating|Modifying|Destroying)/m.test(fs.readFileSync(`${stack}/apply.txt`, 'utf8')) } catch (e) {}

            const body = [
              `@${MERGER} — \`terraform apply\` **failed** on \`${stack}\`.`,
              '',
              started
                ? 'The stack is **partially applied**. State is accurate for the resources that completed; the plan below is exactly what is left over. This will not resolve itself.'
                : 'Terraform **rejected the plan before making any change** — nothing was applied and the stack is exactly as it was. The plan below is what is still pending.',
              '',
              `[Failed run](${RUN_URL}) · commit ${context.sha.slice(0, 8)}`,
              '',
              '<details><summary>Plan as of right now</summary>', '', '```terraform', plan, '```', '</details>',
              '',
              ...(RECOVERY_PR ? [`**Recovery PR:** ${RECOVERY_PR} — its plan is the leftover above. Fix the cause, re-run its plan, review and merge.`, ''] : []),
              '**Next step — every option is a forward apply:**',
              RECOVERY_PR
                ? '- transient (rate limit, timeout, eventual consistency) → re-run the recovery PR\'s plan and merge it; re-running the failed job reuses the now-stale plan and fails again'
                : '- transient (rate limit, timeout, eventual consistency) → dispatch the caller with `command: recover` for this stack; re-running the failed job reuses the now-stale plan and fails again',
              '- config, IAM or quota problem → fix it in a PR, re-plan, apply',
              '- the change was wrong → `git revert`, and apply that as a new reviewed plan',
              '- `AlreadyExists` → the resource exists but is absent from state: add an `import` block in a PR',
              '- `Inconsistent dependency lock file` → a provider floated between plan and apply: commit `.terraform.lock.hcl`, then re-plan',
              '',
              'Do not roll back by hand. This issue closes itself when the next apply of this stack succeeds.',
            ].join('\n')

            const title = `terraform apply failed: ${stack}`
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'terraform-failed', per_page: 100,
            })
            let issue = open.data.find(i => i.title === title)
            if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body })
            } else {
              issue = (await github.rest.issues.create({
                owner, repo, title, body, labels: ['terraform-failed'], assignees: [MERGER],
              })).data
            }

            const prs = context.eventName !== 'push' ? { data: [] } : await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: context.sha,
            })
            for (const pr of prs.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: `@${MERGER} the apply of \`${stack}\` from this PR **failed** and the stack is partially applied. Next steps: #${issue.number}`,
              })
            }

      - name: Drop the applied plan
        if: inputs.command == 'apply' && steps.apply.outcome == 'success'
        env:
          URI: ${{ steps.fetch.outputs.uri }}
          AWS_REGION: ${{ steps.store.outputs.region || inputs.aws-region }}
        run: aws s3 rm --only-show-errors "$URI" || echo "::warning::Could not delete $URI"

      - name: Close the failure issue
        if: inputs.command != 'plan' && steps.apply.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo
            const stack = process.env.STACK
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'terraform-failed', per_page: 100,
            })
            const issue = open.data.find(i => i.title === `terraform apply failed: ${stack}`)
            if (issue) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Apply of \`${stack}\` succeeded at ${context.sha.slice(0, 8)}. Closing.`,
              })
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' })
            }
            const { data: recovery } = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:terraform-recover/${stack}`,
            })
            for (const pr of recovery) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: `Apply of \`${stack}\` succeeded at ${context.sha.slice(0, 8)}; nothing left to recover. Closing.`,
              })
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: 'closed' })
            }

      - name: Fail on apply error
        if: steps.apply.outcome == 'failure'
        run: exit 1
