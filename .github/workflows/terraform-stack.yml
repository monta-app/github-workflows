name: Terraform Stack

# Plans or applies one Terraform stack. Called once per entry in the matrix
# emitted by terraform-discover.yml. See docs/workflow-guide.md.
#
# The caller's job must grant: contents: read, pull-requests: write,
# issues: write, and id-token: write when using an OIDC role. The stack's
# credentials must be able to read, write and delete objects under its state
# key, since the saved plan is stored next to the state (see below).

on:
  workflow_call:
    inputs:
      stack:
        description: Path to the stack directory (the one holding backend.tf).
        type: string
        required: true
      command:
        description: plan, apply, or recover (plan + apply in one run; the plan is not reviewed).
        type: string
        required: true
      environment:
        description: GitHub environment to run apply under. Ignored for plan.
        type: string
        default: ""
      aws-role:
        description: IAM role ARN to assume via OIDC. Leave empty to use the static key secrets.
        type: string
        default: ""
      aws-region:
        type: string
        default: eu-west-1
      terraform-version:
        description: Overrides .terraform-version in the stack directory or repository root.
        type: string
        default: ""
      runner:
        type: string
        default: linux-arm64
    secrets:
      aws-access-key-id:
        required: false
      aws-secret-access-key:
        required: false
      tf-vars-json:
        description: JSON object of Terraform variables, written to the stack as ci.auto.tfvars.json.
        required: false

jobs:
  terraform:
    name: ${{ inputs.command }}
    runs-on: ${{ inputs.runner }}
    concurrency:
      group: tf-${{ inputs.stack }}-${{ inputs.command != 'plan' && 'apply' || github.ref }}
      cancel-in-progress: ${{ inputs.command == 'plan' }}
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.stack }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      STACK: ${{ inputs.stack }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve Terraform version
        id: tfver
        working-directory: .
        env:
          OVERRIDE: ${{ inputs.terraform-version }}
        run: |
          set -eu
          if   [ -n "$OVERRIDE" ];                     then v="$OVERRIDE"
          elif [ -f "$STACK/.terraform-version" ];     then v=$(cat "$STACK/.terraform-version")
          elif [ -f ".terraform-version" ];            then v=$(cat .terraform-version)
          else
            echo "::error title=No Terraform version::Add .terraform-version to $STACK or the repository root."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Terraform $v"

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        if: inputs.aws-role != ''
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ inputs.aws-role }}
          aws-region: ${{ inputs.aws-region }}

      - name: Configure AWS credentials via static keys
        if: inputs.aws-role == ''
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-access-key-id: ${{ secrets.aws-access-key-id }}
          aws-secret-access-key: ${{ secrets.aws-secret-access-key }}
          aws-region: ${{ inputs.aws-region }}

      - name: Write CI variables
        env:
          TF_VARS_JSON: ${{ secrets.tf-vars-json }}
        run: |
          set -eu
          if [ -n "${TF_VARS_JSON:-}" ]; then
            printf '%s' "$TF_VARS_JSON" > ci.auto.tfvars.json
            echo "Wrote ci.auto.tfvars.json"
          fi

      - name: Terraform init
        run: terraform init -input=false -lock-timeout=5m

      # The saved plan embeds the full prior state and every variable value, so it is
      # as secret as the state. It is kept beside the state, under the same key, where
      # only the state's readers can get it - never as an Actions artifact, which
      # anyone with read access to the repository can download.
      - name: Locate the plan store
        id: store
        if: inputs.command == 'plan' || inputs.command == 'apply'
        run: |
          set -eu
          backend=$(jq -c '.backend // empty' .terraform/terraform.tfstate)
          if [ "$(printf '%s' "$backend" | jq -r '.type // empty')" != "s3" ]; then
            echo "::error title=Unsupported backend::$STACK must use the s3 backend; the saved plan is stored beside the state."
            exit 1
          fi
          printf '%s' "$backend" | jq -r '
            "prefix=s3://" + .config.bucket + "/" + .config.key + ".plans",
            "region=" + (.config.region // "")' >> "$GITHUB_OUTPUT"

      - name: Terraform fmt
        if: inputs.command == 'plan'
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        if: inputs.command == 'plan' || inputs.command == 'recover'
        run: |
          set -eu
          terraform plan -no-color -input=false -lock-timeout=5m \
            -out=tfplan -detailed-exitcode > plan.txt 2>&1 && code=0 || code=$?
          tail -c 400000 plan.txt
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "changes=false" >> "$GITHUB_OUTPUT"
               echo "failed=true"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Upload plan
        if: inputs.command == 'plan' && steps.plan.outputs.failed != 'true'
        env:
          URI: ${{ steps.store.outputs.prefix }}/${{ github.event.pull_request.head.sha || github.sha }}.tfplan
          AWS_REGION: ${{ steps.store.outputs.region || inputs.aws-region }}
        run: aws s3 cp --only-show-errors tfplan "$URI"

      - name: Comment plan on the pull request
        if: inputs.command == 'plan' && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PLAN_FAILED: ${{ steps.plan.outputs.failed }}
          HAS_CHANGES: ${{ steps.plan.outputs.changes }}
        with:
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo
            const stack = process.env.STACK
            const plan = fs.readFileSync(`${stack}/plan.txt`, 'utf8')

            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'terraform-failed', per_page: 100,
            })
            const stuck = open.data.find(i => i.title === `terraform apply failed: ${stack}`)
            const banner = stuck
              ? `> [!WARNING]\n> This stack has an **unresolved failed apply** (#${stuck.number}). The plan below may include leftover changes from it — check before merging.\n\n`
              : ''

            // Mirrors "Plan: N to add, N to change, N to destroy." with a
            // colored, at-a-glance version — easier to scan across a PR
            // with several stacks than the plain sentence alone.
            let summary
            if (process.env.PLAN_FAILED === 'true') {
              summary = '❌ Plan failed'
            } else if (process.env.HAS_CHANGES !== 'true') {
              summary = '🔵 No changes'
            } else {
              const counts = plan.match(/^Plan: (\d+) to add, (\d+) to change, (\d+) to destroy\.$/m)
              if (counts) {
                const [toAdd, toChange, toDestroy] = counts.slice(1).map(Number)
                summary = [
                  toAdd     > 0 && `🟢 **${toAdd} to add**`,
                  toChange  > 0 && `🟡 **${toChange} to change**`,
                  toDestroy > 0 && `🔴 **${toDestroy} to destroy**`,
                ].filter(Boolean).join('  ·  ')
              } else {
                summary = 'Changes planned'
              }
            }

            const LIMIT = 60000
            const body = [
              `<!-- terraform-plan:${stack} -->`,
              banner + `### Terraform plan — \`${stack}\``,
              '', `**${summary}**`, '',
              '<details><summary>Show plan</summary>', '', '```terraform',
              plan.length > LIMIT
                ? plan.slice(0, LIMIT) + `\n\n... truncated (${plan.length} chars); see the run log.`
                : plan,
              '```', '</details>',
            ].join('\n')

            const marker = `<!-- terraform-plan:${stack} -->`
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: context.issue.number, per_page: 100,
            })
            const existing = comments.find(c => c.body.includes(marker))
            existing
              ? await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
              : await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body })

      - name: Fail on plan error
        if: steps.plan.outputs.failed == 'true'
        run: exit 1

      - name: Download the reviewed plan
        id: fetch
        if: inputs.command == 'apply'
        env:
          PREFIX: ${{ steps.store.outputs.prefix }}
          AWS_REGION: ${{ steps.store.outputs.region || inputs.aws-region }}
        run: |
          set -eu
          uri="$PREFIX/${{ github.sha }}.tfplan"
          if ! aws s3 cp --only-show-errors "$uri" tfplan 2>/dev/null; then
            head=$(gh api "/repos/$REPO/commits/${{ github.sha }}/pulls" --jq '.[0].head.sha // empty')
            uri="$PREFIX/$head.tfplan"
            if [ -z "$head" ] || ! aws s3 cp --only-show-errors "$uri" tfplan; then
              echo "::error title=No reviewed plan::No saved plan for $STACK at ${{ github.sha }}. Dispatch the caller with command recover for this stack."
              exit 1
            fi
          fi
          echo "uri=$uri" >> "$GITHUB_OUTPUT"

      - name: Terraform apply
        id: apply
        if: inputs.command == 'apply' || inputs.command == 'recover'
        continue-on-error: true
        run: |
          set -o pipefail
          terraform apply -input=false -lock-timeout=5m -no-color tfplan 2>&1 | tee apply.txt

      - name: Re-plan after a failed apply
        if: steps.apply.outcome == 'failure'
        run: terraform plan -no-color -input=false -lock-timeout=5m > replan.txt 2>&1 || true

      - name: Report the failed apply
        if: steps.apply.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          MERGER: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo
            const stack = process.env.STACK
            const { MERGER, RUN_URL } = process.env
            let plan = '(re-plan produced no output)'
            try { plan = fs.readFileSync(`${stack}/replan.txt`, 'utf8').slice(-40000) } catch (e) {}

            let started = true
            try { started = /^\S+: (Creating|Modifying|Destroying)/m.test(fs.readFileSync(`${stack}/apply.txt`, 'utf8')) } catch (e) {}

            const body = [
              `@${MERGER} — \`terraform apply\` **failed** on \`${stack}\`.`,
              '',
              started
                ? 'The stack is **partially applied**. State is accurate for the resources that completed; the plan below is exactly what is left over. This will not resolve itself.'
                : 'Terraform **rejected the plan before making any change** — nothing was applied and the stack is exactly as it was. The plan below is what is still pending.',
              '',
              `[Failed run](${RUN_URL}) · commit ${context.sha.slice(0, 8)}`,
              '',
              '<details><summary>Plan as of right now</summary>', '', '```terraform', plan, '```', '</details>',
              '',
              '**Next step — every option is a forward apply:**',
              '- transient (rate limit, timeout, eventual consistency) → dispatch the caller with `command: recover` for this stack; re-running the failed job reuses the now-stale plan and fails again',
              '- config, IAM or quota problem → fix it in a PR, re-plan, apply',
              '- the change was wrong → `git revert`, and apply that as a new reviewed plan',
              '- `AlreadyExists` → the resource exists but is absent from state: add an `import` block in a PR',
              '- `Inconsistent dependency lock file` → a provider floated between plan and apply: commit `.terraform.lock.hcl`, then re-plan',
              '',
              'Do not roll back by hand. This issue closes itself when the next apply of this stack succeeds.',
            ].join('\n')

            const title = `terraform apply failed: ${stack}`
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'terraform-failed', per_page: 100,
            })
            let issue = open.data.find(i => i.title === title)
            if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body })
            } else {
              issue = (await github.rest.issues.create({
                owner, repo, title, body, labels: ['terraform-failed'], assignees: [MERGER],
              })).data
            }

            const prs = context.eventName !== 'push' ? { data: [] } : await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: context.sha,
            })
            for (const pr of prs.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: `@${MERGER} the apply of \`${stack}\` from this PR **failed** and the stack is partially applied. Next steps: #${issue.number}`,
              })
            }

      - name: Drop the applied plan
        if: inputs.command == 'apply' && steps.apply.outcome == 'success'
        env:
          URI: ${{ steps.fetch.outputs.uri }}
          AWS_REGION: ${{ steps.store.outputs.region || inputs.aws-region }}
        run: aws s3 rm --only-show-errors "$URI" || echo "::warning::Could not delete $URI"

      - name: Close the failure issue
        if: inputs.command != 'plan' && steps.apply.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo
            const stack = process.env.STACK
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'terraform-failed', per_page: 100,
            })
            const issue = open.data.find(i => i.title === `terraform apply failed: ${stack}`)
            if (issue) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Apply of \`${stack}\` succeeded at ${context.sha.slice(0, 8)}. Closing.`,
              })
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' })
            }

      - name: Fail on apply error
        if: steps.apply.outcome == 'failure'
        run: exit 1
