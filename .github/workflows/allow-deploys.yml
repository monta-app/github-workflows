name: Allow deploys

on:
  workflow_call:
    inputs:
      workflow:
        required: true
        type: string
        description: 'Workflow (filename or name) to allow, e.g. "deploy-production.yml".'
    secrets:
      ADMIN_PAT:
        required: false # unused: the deploy lock uses GITHUB_TOKEN; kept so callers that pass it keep working
        description: 'GitHub PAT to update workflows'

permissions:
  actions: write # write: disable, enable and cancel the caller repo's deploy workflow with GITHUB_TOKEN
  contents: read
  id-token: write

jobs:
  allow-release:
    name: Allow release
    runs-on: ${{ github.event.repository.private && 'arc-arm64-1cpu-2gb-nodocker' || 'ubuntu-24.04-arm' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Enable CD on merge to main
      - name: Enable ${{ inputs.workflow }} workflow
        run: gh workflow enable ${{ inputs.workflow }}
        env:
          GH_TOKEN: ${{ github.token }}
