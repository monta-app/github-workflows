name: Deploy

on:
  workflow_call:
    inputs:
      runner-size:
        required: false
        type: string
        description: "Runner to use for the job (normal, or large)"
        default: "normal"
      use-arc-runners:
        required: false
        type: boolean
        default: true
        description: "Run on the self-hosted ARC arm64 runners (default). Never used in public repositories: the ARC runner group rejects them, so they keep the GitHub-hosted runners. Applies to the test, image build and service profile jobs."
      # DEPRECATED (no-op): all builds and CI run on arm64. Retained for backwards
      # compatibility with callers still passing it; the value is ignored and this
      # input will be removed in a future release.
      architecture:
        required: false
        type: string
        description: "[DEPRECATED] Ignored - all builds and CI run on arm64. No-op kept for backwards compatibility; will be removed in a future release."
        default: "arm64"
      stage:
        required: true
        type: string
        description: 'stage being released (dev,staging,production)'
      service-name:
        required: true
        type: string
        description: 'Proper name for your service i.e OCPP Service, Vehicle Service'
      service-emoji:
        required: true
        type: string
        description: 'An emoji to identify your service by :)'
      service-identifier:
        required: true
        type: string
        description: 'Identifier of the service being released i.e ocpp, vehicle, server, wallet.'
      gradle-module:
        required: false
        type: string
        description: 'Name of the Gradle module being tested'
      java-version:
        required: false
        type: string
        default: "21"
        description: 'Java version to use'
      gradle-args:
        required: false
        type: string
        default: "--parallel --build-cache"
        description: 'Additional Gradle arguments'
      cache-gradle-build-outputs:
        required: false
        type: boolean
        default: false
        description: "Cache Gradle task outputs per commit so the production deploy of a SHA can reuse the staging test run (~1 GB cache archive per deploy)."
      region:
        required: false
        type: string
        default: "eu-west-1"
        description: 'AWS region to deploy to'
      docker-file-name:
        required: false
        type: string
        description: Name of the docker file to be built
        default: "Dockerfile"
      additional-build-args:
        required: false
        type: string
        description: 'Additional build arguments for Docker'
      ecr-repository-name:
        required: false
        type: string
        description: 'ECR repository name override'
      enable-release-tag:
        required: false
        type: boolean
        default: false
        description: 'Enable automatic release tag creation on workflow_dispatch'
      release-tag-prefix:
        required: false
        type: string
        description: "Optional prefix for release tag names. If provided, creates tags like 'prefix-YYYY-MM-DD-HH-MM'. Leave empty for date-only tags."
      sentry-project:
        required: false
        type: string
        default: ''
        description: "Sentry project slug for the sentry-release job. Empty uses service-<service-identifier>; set it when the project is named differently (e.g. service-ocpp for service-identifier ocpp-main)."
      sentry-release-from-tag:
        required: false
        type: boolean
        default: false
        description: "Opt in to a Sentry release that matches the release tag. Needs enable-release-tag. With a SENTRY_AUTH_TOKEN secret, a sentry-release job also creates the release in Sentry project service-<service-identifier>, sets its commits and records the deploy. The tag name is decided once at the start of the run and the deploy writes '<tag>+<short sha>' into the values' existing 'sentryRelease' key (kotlin chart >= 1.36.0, which sets SENTRY_RELEASE); the key is never added, since older charts' schemas reject it."
      enable-changelog:
        required: false
        type: boolean
        default: false
        description: 'Enable changelog generation after deployment'
      changelog-tag-pattern:
        required: false
        type: string
        description: 'Regex pattern for matching tag patterns (group 1 should match version) - example: processor-(.*)'
      changelog-path-exclude-pattern:
        required: false
        type: string
        description: 'Regex pattern for excluding file paths from changelog - example: ^gateway/'
      comment-on-prs:
        required: false
        type: boolean
        default: true
        description: 'Comment on PRs with production deployment information (automatically disabled if requirements not met)'
      comment-on-jira:
        required: false
        type: boolean
        default: true
        description: 'Comment on JIRA tickets with production deployment information (automatically disabled if requirements not met)'
      changelog-monitoring-urls:
        required: false
        type: string
        description: "Comma-separated list of dashboard/monitoring URLs for the release notification - example: Grafana|https://grafana.monta.app/d/my-service,Sentry|https://sentry.io/my-service"
      changelog-release-notify-channel:
        required: false
        type: string
        description: 'Slack channel ID or name to post a release notification to, tagging PR authors/co-authors/approvers and linking changelog-monitoring-urls. Independent of enable-changelog - setting this is what enables the notification.'
      run-tests:
        required: false
        type: boolean
        default: true
        description: 'Run tests before deployment'
      update-service-profile:
        required: false
        type: boolean
        default: true
        description: 'Use generated openapi spec to generate linkerd service profile and update the service helm chart'
      openapi-max-workers:
        required: false
        type: string
        default: ''
        description: |
          Optional cap on Gradle parallelism for the OpenAPI build step in the
          update-service-profile job. Forwarded to component-service-profile-kotlin.
          Set to e.g. "2" on multi-module repos that OOM the runner during
          concurrent kapt. Empty string keeps default behavior.
      argocd-server:
        required: false
        type: string
        description: 'ArgoCD server URL (e.g., argocd.monta.app) for deployment monitoring'
      argocd-sync-wait-seconds:
        required: false
        default: 300
        type: number
        description: 'Timeout duration in seconds to wait for ArgoCD sync to apply'
      wait-for-argocd-sync:
        required: false
        type: boolean
        default: true
        description: 'Whether to block the workflow on ArgoCD sync becoming healthy. Set to false to fire-and-forget the deployment (the manifest commit still happens; only the wait step is skipped).'
      git-sha:
        required: false
        type: string
        description: 'Git SHA to checkout and build from. Defaults to the triggering commit SHA.'

    secrets:
      GHL_USERNAME:
        required: true
        description: 'GitHub username for Gradle plugin'
      GHL_PASSWORD:
        required: true
        description: 'GitHub password/token for Gradle plugin'
      AWS_ACCOUNT_ID:
        required: true
        description: 'AWS Account ID for ECR and deployment access'
      SLACK_APP_TOKEN:
        required: false
        description: 'Slack app token for publishing the changelog to #info-releases'
      MANIFEST_REPO_PAT:
        required: true
        description: 'GitHub PAT to commit/push to kube-manifests repo'
      SENTRY_AUTH_TOKEN:
        required: false
        description: 'Sentry auth token, passed as Docker build secret'
      AWS_CDN_ACCESS_KEY_ID:
        required: false
        description: 'CDN access key ID for S3 access, injected into Docker image'
      AWS_CDN_SECRET_ACCESS_KEY:
        required: false
        description: 'CDN secret access key for S3 access, injected into Docker image'
      LOKALISE_TOKEN:
        required: false
        description: 'Lokalise token for Lokalise API'
      LOKALISE_PROJECT_ID:
        required: false
        description: 'Lokalise project ID for Lokalise API'
      GH_ACTION_ACCESS_KEY_ID:
        required: false
        description: "AWS access key for the S3 cache bucket, used on ARC. Without it ARC builds use the GitHub cache."
      GH_ACTION_SECRET_ACCESS_KEY:
        required: false
        description: "AWS secret key for the S3 cache bucket, used on ARC. Without it ARC builds use the GitHub cache."
      JIRA_EMAIL:
        required: false
        description: 'Email for JIRA API authentication (used for ticket operations in changelog)'
      JIRA_TOKEN:
        required: false
        description: 'JIRA API token for authentication (used for ticket operations in changelog)'
      CHANGELOG_GITHUB_TOKEN:
        required: false
        description: 'Deprecated and ignored: the changelog now uses the workflow GITHUB_TOKEN. Kept so existing callers keep working.'
      TAILSCALE_AUTHKEY:
        required: false
        description: 'Unused. The changelog job reaches the identity service over cluster DNS now, so nothing here joins the tailnet. Still declared because a caller that passes it explicitly fails to start if the input disappears; drop it from your secrets block and this can go'
      ARGOCD_TOKEN:
        required: false
        description: 'ArgoCD authentication token for API access'

    outputs:
      stage:
        description: 'Stage that was deployed to (dev,staging,production)'
        value: ${{ jobs.deploy.outputs.stage }}
      docker-image:
        description: 'Docker image repository path'
        value: ${{ jobs.deploy.outputs.docker-image }}
      previous-image-tag:
        description: 'Docker image tag before the deployment (for rollback reference)'
        value: ${{ jobs.deploy.outputs.previous-image-tag }}
      image-tag:
        description: 'Docker image tag that was deployed'
        value: ${{ jobs.deploy.outputs.image-tag }}
      deployment-start-time:
        description: 'ISO 8601 timestamp when deployment started (only if ArgoCD auto-sync enabled)'
        value: ${{ jobs.deploy.outputs.deployment-start-time }}
      deployment-end-time:
        description: 'ISO 8601 timestamp when deployment became healthy (only if ArgoCD auto-sync enabled)'
        value: ${{ jobs.deploy.outputs.deployment-end-time }}
      deployment-url:
        description: 'Direct URL to the application in ArgoCD UI (only if ArgoCD auto-sync enabled)'
        value: ${{ jobs.deploy.outputs.deployment-url }}

permissions:
  id-token: write
  contents: write
  actions: write

jobs:
  release-name:
    name: Release Name
    if: inputs.sentry-release-from-tag && inputs.enable-release-tag
    runs-on: ${{ github.event.repository.private && 'arc-arm64-1cpu-2gb-nodocker' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.name.outputs.tag }}
      sentry-release: ${{ steps.name.outputs.sentry-release }}
    steps:
      - name: Decide the release tag and Sentry release
        id: name
        shell: bash
        env:
          PREFIX: ${{ inputs.release-tag-prefix }}
        run: |
          date_tag=$(date -u +"%Y-%m-%d-%H-%M")
          if [[ -n "$PREFIX" ]]; then
            tag="${PREFIX}-${date_tag}"
          else
            tag="${date_tag}"
          fi
          sentry_release="${tag}+${GITHUB_SHA::8}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sentry-release=$sentry_release" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag, Sentry release: $sentry_release"
  test:
    name: Test
    if: inputs.run-tests
    uses: ./.github/workflows/component-test-kotlin.yml
    with:
      runner-size: ${{ inputs.runner-size }}
      use-arc-runners: ${{ (inputs.use-arc-runners && github.event.repository.private) }}
      service-name: ${{ inputs.service-name }}
      service-emoji: ${{ inputs.service-emoji }}
      gradle-module: ${{ inputs.gradle-module }}
      java-version: ${{ inputs.java-version }}
      gradle-args: ${{ inputs.gradle-args }}
      cache-gradle-build-outputs: ${{ inputs.cache-gradle-build-outputs }}
    secrets:
      GHL_USERNAME: ${{ secrets.GHL_USERNAME }}
      GHL_PASSWORD: ${{ secrets.GHL_PASSWORD }}
      GH_ACTION_ACCESS_KEY_ID: ${{ secrets.GH_ACTION_ACCESS_KEY_ID }}
      GH_ACTION_SECRET_ACCESS_KEY: ${{ secrets.GH_ACTION_SECRET_ACCESS_KEY }}
  build:
    name: Build
    uses: ./.github/workflows/component-build.yml
    with:
      runner-size: ${{ inputs.runner-size }}
      use-arc-runners: ${{ (inputs.use-arc-runners && github.event.repository.private) }}
      stage: ${{ inputs.stage }}
      service-name: ${{ inputs.service-name }}
      service-emoji: ${{ inputs.service-emoji }}
      service-identifier: ${{ inputs.service-identifier }}
      region: ${{ inputs.region }}
      docker-file-name: ${{ inputs.docker-file-name }}
      additional-build-args: ${{ inputs.additional-build-args }}
      ecr-repository-name: ${{ inputs.ecr-repository-name }}
      git-sha: ${{ inputs.git-sha }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      GHL_USERNAME: ${{ secrets.GHL_USERNAME }}
      GHL_PASSWORD: ${{ secrets.GHL_PASSWORD }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      AWS_CDN_ACCESS_KEY_ID: ${{ secrets.AWS_CDN_ACCESS_KEY_ID }}
      AWS_CDN_SECRET_ACCESS_KEY: ${{ secrets.AWS_CDN_SECRET_ACCESS_KEY }}
      LOKALISE_TOKEN: ${{ secrets.LOKALISE_TOKEN }}
      LOKALISE_PROJECT_ID: ${{ secrets.LOKALISE_PROJECT_ID }}
      GH_ACTION_ACCESS_KEY_ID: ${{ secrets.GH_ACTION_ACCESS_KEY_ID }}
      GH_ACTION_SECRET_ACCESS_KEY: ${{ secrets.GH_ACTION_SECRET_ACCESS_KEY }}
  deploy:
    name: Deploy
    needs:
      - test
      - build
      - release-name
    if: always() && (!inputs.run-tests || needs.test.result == 'success') && needs.build.result == 'success' && needs.release-name.result != 'failure'
    uses: ./.github/workflows/component-deploy.yml
    with:
      sentry-release: ${{ needs.release-name.outputs.sentry-release }}
      release-tag: ${{ needs.release-name.outputs.tag }}
      service-name: ${{ inputs.service-name }}
      service-emoji: ${{ inputs.service-emoji }}
      service-identifier: ${{ inputs.service-identifier }}
      stage: ${{ inputs.stage }}
      image-tag: ${{ needs.build.outputs.image-tag }}
      argocd-server: ${{ inputs.argocd-server }}
      argocd-sync-wait-seconds: ${{ inputs.argocd-sync-wait-seconds }}
      wait-for-argocd-sync: ${{ inputs.wait-for-argocd-sync }}
    secrets:
      MANIFEST_REPO_PAT: ${{ secrets.MANIFEST_REPO_PAT }}
      ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
  sentry-release:
    name: Sentry Release
    needs: [deploy, release-name]
    # Opt-in: only for callers using sentry-release-from-tag, after a successful deploy.
    # Never fails the deploy run: a Sentry outage or a wrong token only leaves a warning.
    if: always() && inputs.sentry-release-from-tag && needs.deploy.result == 'success' && needs.release-name.outputs.sentry-release != ''
    continue-on-error: true
    # getsentry/action-release runs a Docker image on Linux, so this job needs a runner with Docker.
    runs-on: ${{ github.event.repository.private && 'arc-arm64-2cpu-4gb' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 5
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: monta-app
      DEPLOY_STARTED: ${{ needs.deploy.outputs.deployment-start-time }}
    steps:
      - name: Check for a Sentry token
        id: token
        shell: bash
        run: |
          if [[ -z "$SENTRY_AUTH_TOKEN" ]]; then
            echo "::notice::No SENTRY_AUTH_TOKEN passed; skipping Sentry release commits and deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$DEPLOY_STARTED" ]]; then
            echo "started-at=$(date -u -d "$DEPLOY_STARTED" +%s)" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the deployed commit
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Create Sentry release, set commits and record the deploy
        if: steps.token.outputs.present == 'true'
        uses: getsentry/action-release@2e505a70ff06dac263413242aa3617fec90134e5 # v3.9.1
        with:
          release: ${{ needs.release-name.outputs.sentry-release }}
          projects: ${{ inputs.sentry-project || format('service-{0}', inputs.service-identifier) }}
          environment: ${{ inputs.stage }}
          started_at: ${{ steps.token.outputs.started-at }}
          set_commits: auto
          ignore_missing: true
          finalize: true
          disable_telemetry: true
      - name: Link the Sentry release to the GitHub release
        if: steps.token.outputs.present == 'true'
        shell: bash
        env:
          SENTRY_RELEASE: ${{ needs.release-name.outputs.sentry-release }}
          RELEASE_TAG: ${{ needs.release-name.outputs.tag }}
        run: |
          # getsentry/action-release has no input for the release's url, so set it through Sentry's API.
          # The tag and GitHub release are created by later jobs; the link is built from the tag name.
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          encoded=$(jq -rn --arg v "$SENTRY_RELEASE" '$v|@uri')
          body=$(jq -n --arg url "$url" '{url: $url}')
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" -H "Content-Type: application/json" \
            --data "$body" "https://sentry.io/api/0/organizations/${SENTRY_ORG}/releases/${encoded}/") || status=000
          if [[ "$status" == "200" ]]; then
            echo "Sentry release $SENTRY_RELEASE links to $url"
          else
            echo "::warning::Could not set the GitHub release link on Sentry release $SENTRY_RELEASE (HTTP $status)"
          fi
  update-service-profile:
    name: Update Service Profile
    needs: deploy
    if: always() && inputs.update-service-profile && needs.deploy.result == 'success'
    uses: ./.github/workflows/component-service-profile-kotlin.yml
    with:
      service-identifier: ${{ inputs.service-identifier }}
      stage: ${{ inputs.stage }}
      gradle-module: ${{ inputs.gradle-module }}
      java-version: ${{ inputs.java-version }}
      openapi-max-workers: ${{ inputs.openapi-max-workers }}
      use-arc-runners: ${{ (inputs.use-arc-runners && github.event.repository.private) }}
      image-tag: ${{ needs.deploy.outputs.image-tag }}
      ecr-repository-name: ${{ inputs.ecr-repository-name || format('{0}-{1}', inputs.service-identifier, inputs.stage) }}
      region: ${{ inputs.region }}
    secrets:
        GHL_USERNAME: ${{ secrets.GHL_USERNAME }}
        GHL_PASSWORD: ${{ secrets.GHL_PASSWORD }}
        MANIFEST_REPO_PAT: ${{ secrets.MANIFEST_REPO_PAT }}
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  create-release-tag:
    name: Create Release Tag
    if: always() && inputs.enable-release-tag && needs.deploy.result == 'success'
    needs: [deploy, release-name]
    uses: ./.github/workflows/create-release-tag.yml
    with:
      prefix: ${{ inputs.release-tag-prefix }}
      tag: ${{ needs.release-name.outputs.tag }}
  create-changelog:
    name: Create and Publish Changelog
    needs: [create-release-tag, deploy]
    if: always() && inputs.enable-changelog && needs.deploy.result == 'success'
    runs-on: ${{ github.event.repository.private && 'arc-arm64-1cpu-2gb-nodocker' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 5
    # Only the changelog runs here: the release needs contents, the "Production Deployment" PR comment needs pull-requests.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Run changelog cli action
        uses: monta-app/changelog-cli-action@main
        with:
          service-name: ${{ inputs.service-name }}
          github-release: true
          github-token: ${{ github.token }}
          github-tag-pattern: ${{ inputs.changelog-tag-pattern }}
          github-path-exclude-pattern: ${{ inputs.changelog-path-exclude-pattern }}
          jira-app-name: "montaapp"
          jira-email: ${{ secrets.JIRA_EMAIL }}
          jira-token: ${{ secrets.JIRA_TOKEN }}
          output: "slack"
          slack-token: ${{ secrets.SLACK_APP_TOKEN }}
          # Slack channel: C02PDBL6GAU = #info-releases
          slack-channel: "C02PDBL6GAU"
          stage: ${{ needs.deploy.outputs.stage }}
          docker-image: ${{ needs.deploy.outputs.docker-image }}
          image-tag: ${{ needs.deploy.outputs.image-tag }}
          previous-image-tag: ${{ needs.deploy.outputs.previous-image-tag }}
          deployment-start-time: ${{ needs.deploy.outputs.deployment-start-time }}
          deployment-end-time: ${{ needs.deploy.outputs.deployment-end-time }}
          deployment-url: ${{ needs.deploy.outputs.deployment-url }}
          comment-on-prs: ${{ inputs.comment-on-prs }}
          comment-on-jira: ${{ inputs.comment-on-jira }}
          jira-project-blacklist: ${{ vars.CHANGELOG_JIRA_PROJECT_BLACKLIST }}
          monitoring-urls: ${{ inputs.changelog-monitoring-urls }}
          release-notify-channel: ${{ inputs.changelog-release-notify-channel }}
          # Cluster-local URL: this job lands on an ARC runner inside the same EKS cluster as
          # the identity service, so it resolves over cluster DNS with no VPN hop. Public repos
          # fall back to `ubuntu-24.04-arm` (see runs-on), where the name does not resolve — the
          # CLI then degrades to GitHub-profile-email lookups instead of failing.
          identity-resolve-url: ${{ vars.CHANGELOG_IDENTITY_RESOLVE_URL }}
