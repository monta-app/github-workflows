name: pnpm Dependency Submission
on:
  workflow_call:
    inputs:
      lockfile:
        required: false
        type: string
        default: 'pnpm-lock.yaml'
        description: "Path of the pnpm lockfile, relative to the repository root."
      use-arc-runners:
        required: false
        type: boolean
        default: true
        description: "Run on the self-hosted ARC arm64 runners (default). Never used in public repositories: the ARC runner group rejects them, so they keep the GitHub-hosted runners."
jobs:
  submit:
    name: Submit pnpm dependencies
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ${{ (inputs.use-arc-runners && github.event.repository.private) && 'arc-arm64-1cpu-2gb-nodocker' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: monta-app/github-workflows/.github/actions/pnpm-dependency-graph@main
        with:
          lockfile: ${{ inputs.lockfile }}
          github-token: ${{ github.token }}
