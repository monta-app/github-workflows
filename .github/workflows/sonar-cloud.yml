name: SonarQube Analysis
on:
  workflow_call:
    inputs:
      runner-size:
        required: false
        type: string
        description: "Runner to use for the job (normal, or large)"
        default: "normal"
      use-blacksmith-runners:
        required: false
        type: boolean
        default: true
        description: "Run on Blacksmith arm64 cloud runners (default). Set to false to run on the self-hosted linux-arm64 runners."
      use-arc-runners:
        required: false
        type: boolean
        default: true
        description: "Run on the self-hosted ARC arm64 runners (default; takes precedence over use-blacksmith-runners). SonarQube is reached in-cluster without Tailscale, and caches go to S3 when the GH_ACTION_ACCESS_KEY_ID and GH_ACTION_SECRET_ACCESS_KEY secrets are passed (GitHub cache otherwise). Set to false to opt out."
      # DEPRECATED (no-op): all builds and CI run on arm64. Retained for backwards
      # compatibility with callers still passing it; the value is ignored and this
      # input will be removed in a future release.
      architecture:
        required: false
        type: string
        description: "[DEPRECATED] Ignored - all builds and CI run on arm64. No-op kept for backwards compatibility; will be removed in a future release."
        default: "arm64"
      java-version:
        required: false
        type: string
        default: '21'
      gradle-module:
        required: false
        type: string
        description: 'Name of the gradle module being tested'
      gradle-args:
        required: false
        type: string
        default: "--parallel --build-cache"
        description: 'Additional Gradle arguments'
      sonar-non-blocking:
        required: false
        type: boolean
        description: "When true (default), a failure of the Tailscale bring-up or the SonarQube analysis step does not fail the job; tests still gate. SonarQube depends on the Monta VPN, so infra outages (expired auth key, Tailscale package CDN down, SonarQube unreachable) would otherwise fail the workflow. Set to false to make SonarQube a hard gate again."
        default: true
    secrets:
      GH_ACTION_ACCESS_KEY_ID:
        required: false
        description: "AWS access key for the S3 cache bucket, used on ARC. Without it ARC jobs use the GitHub cache."
      GH_ACTION_SECRET_ACCESS_KEY:
        required: false
        description: "AWS secret key for the S3 cache bucket, used on ARC. Without it ARC jobs use the GitHub cache."
      TAILSCALE_AUTHKEY:
        required: false
        description: "Tailscale auth key. When set, the runner joins the tailnet so it can reach the self-hosted SonarQube. Leave unset to keep scanning SonarCloud."
      GHL_USERNAME:
        required: true
        description: "Github Username (Gradle plugin)"
      GHL_PASSWORD:
        required: true
        description: "Github Password (Gradle plugin)"
      SONAR_TOKEN:
        required: true
        description: "Sonar token (Optional, won't publish to sonar if not present)"
env:
  # Test names with non-ASCII characters become report file names; the ARC runner image defaults to a POSIX locale.
  LC_ALL: ${{ inputs.use-arc-runners && 'C.UTF-8' || '' }}
  # On ARC the caches use S3 when the caller passes the bucket credentials, and the GitHub cache otherwise.
  S3_CACHE: ${{ inputs.use-arc-runners && secrets.GH_ACTION_ACCESS_KEY_ID != '' }}
jobs:
  setup:
    name: Setup
    runs-on: ${{ inputs.use-arc-runners && 'arc-arm64-2cpu-4gb' || 'linux-arm64' }}
    outputs:
      runner-name: ${{ steps.runner.outputs.runner-name }}
    steps:
      - name: Get runner name
        id: runner
        uses: monta-app/github-workflows/.github/actions/runner-size-converter@main
        with:
          runner-size: ${{ inputs.runner-size }}
          use-blacksmith-runners: ${{ inputs.use-blacksmith-runners }}
          use-arc-runners: ${{ inputs.use-arc-runners }}
  sonar-cloud:
    name: SonarQube Analysis
    needs: setup
    runs-on: ${{ needs.setup.outputs.runner-name }}
    timeout-minutes: 30
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Shallow clones should be disabled for a better relevancy of analysis
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: corretto
          java-version: ${{ inputs.java-version }}
      - name: Restore Gradle cache
        id: gradle-cache
        if: ${{ env.S3_CACHE != 'true' }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with: &gradle-cache-restore
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-main-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-main-
      - name: Restore Gradle cache (S3)
        id: gradle-cache-s3
        if: ${{ env.S3_CACHE == 'true' }}
        uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: &s3-cache-env
          RUNS_ON_S3_BUCKET_CACHE: monta-github-ci-cache
          RUNS_ON_RUNNER_NAME: ""
          AWS_ACCESS_KEY_ID: ${{ secrets.GH_ACTION_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GH_ACTION_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-west-1
        with: *gradle-cache-restore
      - name: Cache SonarQube packages
        if: ${{ env.S3_CACHE != 'true' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with: &sonar-cache
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube packages (S3)
        if: ${{ env.S3_CACHE == 'true' }}
        uses: runs-on/cache@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *s3-cache-env
        with: *sonar-cache
      # The self-hosted SonarQube lives behind the Monta VPN, so the runner
      # needs to join the tailnet before the scan step can reach it. Skipped
      # automatically for repos still on SonarCloud (no TAILSCALE_AUTHKEY passed).
      - name: Tailscale
        id: tailscale
        if: ${{ !inputs.use-arc-runners && env.TAILSCALE_AUTHKEY != '' }}
        continue-on-error: ${{ inputs.sonar-non-blocking }}
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}
          hostname: "github-${{ github.run_id }}"
          # v4 passes --accept-routes itself; repeating it in args fails `tailscale up`
          args: "--login-server https://headscale.monta.com"
      - name: Run tests with coverage
        env:
          GHL_USERNAME: ${{ secrets.GHL_USERNAME }}
          GHL_PASSWORD: ${{ secrets.GHL_PASSWORD }}
        uses: monta-app/github-workflows/.github/actions/gradle-multi-module@main
        with:
          gradle-module: ${{ inputs.gradle-module }}
          gradle-tasks: 'test koverXmlReport'
          gradle-args: ${{ inputs.gradle-args }}
      # Wait for the tailnet path to SonarQube to actually be usable before
      # scanning. `tailscale up` returns before DERP/route programming has
      # settled, so the scanner's first call (GET /api/v2/analysis/version)
      # can hit a half-open path and fail fast with "failed: null" — the
      # scanner's default connect timeout is only 5s. Polling that exact
      # endpoint until it answers both waits out the race AND warms the
      # relay path, so the scan starts on a connection we know works.
      - name: Wait for SonarQube to be reachable over the tailnet
        if: ${{ !inputs.use-arc-runners && steps.tailscale.outcome != 'failure' && env.TAILSCALE_AUTHKEY != '' }}
        continue-on-error: ${{ inputs.sonar-non-blocking }}
        shell: bash
        env:
          SONAR_HOST_URL: https://sonarqube.vpn.internal.monta.app/
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          BASE="${SONAR_HOST_URL%/}"                 # strip trailing slash -> no /api//...
          HEALTH_URL="${BASE}/api/v2/analysis/version"

          MAX_ATTEMPTS=18       # exits early on first success; ~3-4 min worst case
          CONNECT_TIMEOUT=10    # seconds for the TCP/TLS connect phase per attempt
          SLEEP_BETWEEN=5       # seconds between attempts

          echo "Probing ${HEALTH_URL} until reachable…"
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            # --fail            -> non-2xx counts as a miss (retry)
            # --connect-timeout -> bounds the connect phase (the thing that times out)
            # -u "${TOKEN}:"    -> token as basic-auth user; harmless if the endpoint
            #                      is anonymous, required if "Force user authentication"
            #                      is enabled.
            if curl --silent --show-error --fail \
                    --connect-timeout "$CONNECT_TIMEOUT" \
                    --max-time "$(( CONNECT_TIMEOUT + 5 ))" \
                    -u "${SONAR_TOKEN}:" \
                    -o /dev/null \
                    "$HEALTH_URL"; then
              echo "✅ Reachable on attempt ${attempt}/${MAX_ATTEMPTS}"
              exit 0
            fi
            echo "… attempt ${attempt}/${MAX_ATTEMPTS} missed; retry in ${SLEEP_BETWEEN}s"
            sleep "$SLEEP_BETWEEN"
          done

          echo "::error::SonarQube unreachable over the tailnet after ${MAX_ATTEMPTS} attempts — likely DERP/route health. Check the 'tailscale status' / 'tailscale ping' output above."
          exit 1
      # != 'failure' (not == 'success') keeps the SonarCloud path when Tailscale is skipped.
      - name: Analyze with SonarQube
        if: ${{ steps.tailscale.outcome != 'failure' }}
        continue-on-error: ${{ inputs.sonar-non-blocking }}
        env:
          GHL_USERNAME: ${{ secrets.GHL_USERNAME }}
          GHL_PASSWORD: ${{ secrets.GHL_PASSWORD }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: monta-app/github-workflows/.github/actions/gradle-multi-module@main
        with:
          gradle-module: ${{ inputs.gradle-module }}
          gradle-tasks: 'sonar'
          # ARC runs in the same cluster as SonarQube, whose vpn.internal hostname is only reachable over Tailscale.
          gradle-args: ${{ inputs.gradle-args }}${{ inputs.use-arc-runners && ' -Dsonar.host.url=http://sonarqube.sonarqube.svc.cluster.local:9000' || '' }}
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports-${{ inputs.gradle-module || 'root' }}
          path: |
            **/build/reports/kover/html/**
            **/build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 30
      - name: Save Gradle cache
        if: ${{ always() && env.S3_CACHE != 'true' && github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with: &gradle-cache-save
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-main-${{ github.sha }}
      - name: Save Gradle cache (S3)
        if: ${{ always() && env.S3_CACHE == 'true' && github.ref == 'refs/heads/main' && steps.gradle-cache-s3.outputs.cache-hit != 'true' }}
        uses: runs-on/cache/save@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *s3-cache-env
        with: *gradle-cache-save
