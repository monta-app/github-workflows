name: SonarQube Analysis
on:
  workflow_call:
    inputs:
      runner-size:
        required: false
        type: string
        description: "Runner to use for the job (normal, or large)"
        default: "normal"
      use-blacksmith-runners:
        required: false
        type: boolean
        default: true
        description: "Run on Blacksmith arm64 cloud runners (default). Set to false to run on the self-hosted linux-arm64 runners."
      # DEPRECATED (no-op): all builds and CI run on arm64. Retained for backwards
      # compatibility with callers still passing it; the value is ignored and this
      # input will be removed in a future release.
      architecture:
        required: false
        type: string
        description: "[DEPRECATED] Ignored - all builds and CI run on arm64. No-op kept for backwards compatibility; will be removed in a future release."
        default: "arm64"
      java-version:
        required: false
        type: string
        default: '21'
      gradle-module:
        required: false
        type: string
        description: 'Name of the gradle module being tested'
      gradle-args:
        required: false
        type: string
        default: "--no-daemon --parallel"
        description: 'Additional Gradle arguments'
      sonar-non-blocking:
        required: false
        type: boolean
        description: "When true (default), a failure of the Tailscale bring-up or the SonarQube analysis step does not fail the job; tests still gate. SonarQube depends on the Monta VPN, so infra outages (expired auth key, Tailscale package CDN down, SonarQube unreachable) would otherwise fail the workflow. Set to false to make SonarQube a hard gate again."
        default: true
    secrets:
      TAILSCALE_AUTHKEY:
        required: false
        description: "Tailscale auth key. When set, the runner joins the tailnet so it can reach the self-hosted SonarQube. Leave unset to keep scanning SonarCloud."
      GHL_USERNAME:
        required: true
        description: "Github Username (Gradle plugin)"
      GHL_PASSWORD:
        required: true
        description: "Github Password (Gradle plugin)"
      SONAR_TOKEN:
        required: true
        description: "Sonar token (Optional, won't publish to sonar if not present)"
jobs:
  setup:
    name: Setup
    runs-on: linux-arm64
    outputs:
      runner-name: ${{ steps.runner.outputs.runner-name }}
    steps:
      - name: Get runner name
        id: runner
        uses: monta-app/github-workflows/.github/actions/runner-size-converter@main
        with:
          runner-size: ${{ inputs.runner-size }}
          use-blacksmith-runners: ${{ inputs.use-blacksmith-runners }}
  sonar-cloud:
    name: SonarQube Analysis
    needs: setup
    runs-on: ${{ needs.setup.outputs.runner-name }}
    timeout-minutes: 30
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Shallow clones should be disabled for a better relevancy of analysis
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: corretto
          java-version: ${{ inputs.java-version }}
      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-main-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-main-
      - name: Cache SonarQube packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      # The self-hosted SonarQube lives behind the Monta VPN, so the runner
      # needs to join the tailnet before the scan step can reach it. Skipped
      # automatically for repos still on SonarCloud (no TAILSCALE_AUTHKEY passed).
      - name: Tailscale
        id: tailscale
        if: ${{ env.TAILSCALE_AUTHKEY != '' }}
        continue-on-error: ${{ inputs.sonar-non-blocking }}
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}
          hostname: "github-${{ github.run_id }}"
          # v4 passes --accept-routes itself; repeating it in args fails `tailscale up`
          args: "--login-server https://headscale.monta.com"
      - name: Run tests with coverage
        env:
          GHL_USERNAME: ${{ secrets.GHL_USERNAME }}
          GHL_PASSWORD: ${{ secrets.GHL_PASSWORD }}
        uses: monta-app/github-workflows/.github/actions/gradle-multi-module@main
        with:
          gradle-module: ${{ inputs.gradle-module }}
          gradle-tasks: 'test koverXmlReport'
          gradle-args: ${{ inputs.gradle-args }}
      # Wait for the tailnet path to SonarQube to actually be usable before
      # scanning. `tailscale up` returns before DERP/route programming has
      # settled, so the scanner's first call (GET /api/v2/analysis/version)
      # can hit a half-open path and fail fast with "failed: null" — the
      # scanner's default connect timeout is only 5s. Polling that exact
      # endpoint until it answers both waits out the race AND warms the
      # relay path, so the scan starts on a connection we know works.
      - name: Wait for SonarQube to be reachable over the tailnet
        if: ${{ steps.tailscale.outcome != 'failure' && env.TAILSCALE_AUTHKEY != '' }}
        continue-on-error: ${{ inputs.sonar-non-blocking }}
        shell: bash
        env:
          SONAR_HOST_URL: https://sonarqube.vpn.internal.monta.app/
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          BASE="${SONAR_HOST_URL%/}"                 # strip trailing slash -> no /api//...
          HEALTH_URL="${BASE}/api/v2/analysis/version"

          MAX_ATTEMPTS=18       # exits early on first success; ~3-4 min worst case
          CONNECT_TIMEOUT=10    # seconds for the TCP/TLS connect phase per attempt
          SLEEP_BETWEEN=5       # seconds between attempts

          echo "Probing ${HEALTH_URL} until reachable…"
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            # --fail            -> non-2xx counts as a miss (retry)
            # --connect-timeout -> bounds the connect phase (the thing that times out)
            # -u "${TOKEN}:"    -> token as basic-auth user; harmless if the endpoint
            #                      is anonymous, required if "Force user authentication"
            #                      is enabled.
            if curl --silent --show-error --fail \
                    --connect-timeout "$CONNECT_TIMEOUT" \
                    --max-time "$(( CONNECT_TIMEOUT + 5 ))" \
                    -u "${SONAR_TOKEN}:" \
                    -o /dev/null \
                    "$HEALTH_URL"; then
              echo "✅ Reachable on attempt ${attempt}/${MAX_ATTEMPTS}"
              exit 0
            fi
            echo "… attempt ${attempt}/${MAX_ATTEMPTS} missed; retry in ${SLEEP_BETWEEN}s"
            sleep "$SLEEP_BETWEEN"
          done

          echo "::error::SonarQube unreachable over the tailnet after ${MAX_ATTEMPTS} attempts — likely DERP/route health. Check the 'tailscale status' / 'tailscale ping' output above."
          exit 1
      # != 'failure' (not == 'success') keeps the SonarCloud path when Tailscale is skipped.
      - name: Analyze with SonarQube
        if: ${{ steps.tailscale.outcome != 'failure' }}
        continue-on-error: ${{ inputs.sonar-non-blocking }}
        env:
          GHL_USERNAME: ${{ secrets.GHL_USERNAME }}
          GHL_PASSWORD: ${{ secrets.GHL_PASSWORD }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: monta-app/github-workflows/.github/actions/gradle-multi-module@main
        with:
          gradle-module: ${{ inputs.gradle-module }}
          gradle-tasks: 'sonar'
          gradle-args: ${{ inputs.gradle-args }}
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports-${{ inputs.gradle-module || 'root' }}
          path: |
            **/build/reports/kover/html/**
            **/build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 30
      - name: Save Gradle cache
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-main-${{ github.sha }}
