name: Deploy V2 (Service Repo)

on:
  workflow_call:
    inputs:
      runner-size:
        required: false
        type: string
        description: "Runner to use for the job (normal, or large)"
        default: "normal"
      use-blacksmith-runners:
        required: false
        type: boolean
        default: true
        description: "Run on Blacksmith arm64 cloud runners (default). Set to false to run on the self-hosted linux-arm64 runners."
      use-arc-runners:
        required: false
        type: boolean
        default: false
        description: "Run on the self-hosted ARC arm64 runners (takes precedence over use-blacksmith-runners). Applies to the test and image build jobs."
      # DEPRECATED (no-op): all builds and CI run on arm64. Retained for backwards
      # compatibility with callers still passing it; the value is ignored and this
      # input will be removed in a future release.
      architecture:
        required: false
        type: string
        description: "[DEPRECATED] Ignored - all builds and CI run on arm64. No-op kept for backwards compatibility; will be removed in a future release."
        default: "arm64"
      stage:
        required: true
        type: string
        description: 'stage being released (dev,staging,production)'
      service-name:
        required: true
        type: string
        description: 'Proper name for your service i.e OCPP Service, Vehicle Service'
      service-emoji:
        required: true
        type: string
        description: 'An emoji to identify your service by :)'
      service-identifier:
        required: true
        type: string
        description: 'Identifier of the service being released i.e ocpp, vehicle, server, wallet.'
      gradle-module:
        required: false
        type: string
        description: 'Name of the Gradle module being tested'
      java-version:
        required: false
        type: string
        default: "21"
        description: 'Java version to use'
      gradle-args:
        required: false
        type: string
        default: "--parallel --build-cache"
        description: 'Additional Gradle arguments'
      region:
        required: false
        type: string
        default: "eu-west-1"
        description: 'AWS region to deploy to'
      docker-file-name:
        required: false
        type: string
        description: Name of the docker file to be built
        default: "Dockerfile"
      additional-build-args:
        required: false
        type: string
        description: 'Additional build arguments for Docker'
      ecr-repository-name:
        required: false
        type: string
        description: 'ECR repository name override'
      enable-release-tag:
        required: false
        type: boolean
        default: false
        description: 'Enable automatic release tag creation on workflow_dispatch'
      release-tag-prefix:
        required: false
        type: string
        description: "Optional prefix for release tag names. If provided, creates tags like 'prefix-YYYY-MM-DD-HH-MM'. Leave empty for date-only tags."
      enable-changelog:
        required: false
        type: boolean
        default: false
        description: 'Enable changelog generation after deployment'
      changelog-tag-pattern:
        required: false
        type: string
        description: 'Regex pattern for matching tag patterns (group 1 should match version) - example: processor-(.*)'
      changelog-path-exclude-pattern:
        required: false
        type: string
        description: 'Regex pattern for excluding file paths from changelog - example: ^gateway/'
      comment-on-prs:
        required: false
        type: boolean
        default: true
        description: 'Comment on PRs with production deployment information (automatically disabled if requirements not met)'
      comment-on-jira:
        required: false
        type: boolean
        default: true
        description: 'Comment on JIRA tickets with production deployment information (automatically disabled if requirements not met)'
      changelog-monitoring-urls:
        required: false
        type: string
        description: "Comma-separated list of dashboard/monitoring URLs for the release notification - example: Grafana|https://grafana.monta.app/d/my-service,Sentry|https://sentry.io/my-service"
      changelog-release-notify-channel:
        required: false
        type: string
        description: 'Slack channel ID or name to post a release notification to, tagging PR authors/co-authors/approvers and linking changelog-monitoring-urls. Independent of enable-changelog - setting this is what enables the notification.'
      run-tests:
        required: false
        type: boolean
        default: true
        description: 'Run tests before deployment'
      update-service-profile:
        required: false
        type: boolean
        default: true
        description: 'Use generated openapi spec to generate linkerd service profile and update the service helm chart'
      openapi-max-workers:
        required: false
        type: string
        default: ''
        description: |
          Optional cap on Gradle parallelism for the OpenAPI build step in the
          update-service-profile job. Forwarded to component-service-profile-kotlin.
          Set to e.g. "2" on multi-module repos that OOM the runner during
          concurrent kapt. Empty string keeps default behavior.
      helm-values-path:
        required: false
        type: string
        description: 'Path to helm values directory (default: helm/{service-identifier}/{stage}/app)'
      repository-name:
        required: false
        type: string
        description: 'Repository name override (default: service-{service-identifier})'
      argocd-server:
        required: false
        type: string
        description: 'ArgoCD server URL (e.g., argocd.monta.app) for deployment monitoring'
      argocd-app-name:
        required: false
        type: string
        description: 'ArgoCD application name prefix (without stage). Defaults to service-identifier. Used for kube-manifests lookup (apps/{argocd-app-name}/{stage}/...) and ArgoCD app name ({argocd-app-name}-{stage}).'
      argocd-sync-wait-seconds:
        required: false
        default: 300
        type: number
        description: 'Timeout duration in seconds to wait for ArgoCD sync to apply'
      wait-for-argocd-sync:
        required: false
        type: boolean
        default: true
        description: 'Whether to block the workflow on ArgoCD sync becoming healthy. Set to false to fire-and-forget the deployment (the manifest commit still happens; only the wait step is skipped).'
      git-sha:
        required: false
        type: string
        description: 'Git SHA to checkout and build from. Defaults to the triggering commit SHA.'

    secrets:
      GHL_USERNAME:
        required: true
        description: 'GitHub username for Gradle plugin'
      GHL_PASSWORD:
        required: true
        description: 'GitHub password/token for Gradle plugin'
      AWS_ACCOUNT_ID:
        required: true
        description: 'AWS Account ID for ECR and deployment access'
      SLACK_APP_TOKEN:
        required: false
        description: 'Slack app token for publishing the changelog to #info-releases'
      MANIFEST_REPO_PAT:
        required: true
        description: 'GitHub PAT to commit/push to service repository'
      SENTRY_AUTH_TOKEN:
        required: false
        description: 'Sentry auth token, passed as Docker build secret'
      AWS_CDN_ACCESS_KEY_ID:
        required: false
        description: 'CDN access key ID for S3 access, injected into Docker image'
      AWS_CDN_SECRET_ACCESS_KEY:
        required: false
        description: 'CDN secret access key for S3 access, injected into Docker image'
      LOKALISE_TOKEN:
        required: false
        description: 'Lokalise token for Lokalise API'
      LOKALISE_PROJECT_ID:
        required: false
        description: 'Lokalise project ID for Lokalise API'
      GH_ACTION_ACCESS_KEY_ID:
        required: false
        description: "AWS access key for the S3 cache bucket, used on ARC. Without it ARC builds use the GitHub cache."
      GH_ACTION_SECRET_ACCESS_KEY:
        required: false
        description: "AWS secret key for the S3 cache bucket, used on ARC. Without it ARC builds use the GitHub cache."
      JIRA_EMAIL:
        required: false
        description: 'Email for JIRA API authentication (used for ticket operations in changelog)'
      JIRA_TOKEN:
        required: false
        description: 'JIRA API token for authentication (used for ticket operations in changelog)'
      CHANGELOG_GITHUB_TOKEN:
        required: false
        description: 'GitHub token for changelog generation'
      TAILSCALE_AUTHKEY:
        required: false
        description: 'Tailscale auth key. Lets the changelog job join the tailnet to reach the internal identity service (repo/org variable CHANGELOG_IDENTITY_RESOLVE_URL) used to tag release notification contributors; leave unset to skip'
      ARGOCD_TOKEN:
        required: false
        description: 'ArgoCD authentication token for API access'

    outputs:
      stage:
        description: 'Stage that was deployed to (dev,staging,production)'
        value: ${{ jobs.deploy.outputs.stage }}
      docker-image:
        description: 'Docker image repository path'
        value: ${{ jobs.deploy.outputs.docker-image }}
      previous-image-tag:
        description: 'Docker image tag before the deployment (for rollback reference)'
        value: ${{ jobs.deploy.outputs.previous-image-tag }}
      image-tag:
        description: 'Docker image tag that was deployed'
        value: ${{ jobs.deploy.outputs.image-tag }}
      deployment-start-time:
        description: 'ISO 8601 timestamp when deployment started (only if ArgoCD auto-sync enabled)'
        value: ${{ jobs.deploy.outputs.deployment-start-time }}
      deployment-end-time:
        description: 'ISO 8601 timestamp when deployment became healthy (only if ArgoCD auto-sync enabled)'
        value: ${{ jobs.deploy.outputs.deployment-end-time }}
      deployment-url:
        description: 'Direct URL to the application in ArgoCD UI (only if ArgoCD auto-sync enabled)'
        value: ${{ jobs.deploy.outputs.deployment-url }}

permissions:
  id-token: write
  contents: write
  actions: write

jobs:
  test:
    name: Test
    if: inputs.run-tests
    uses: ./.github/workflows/component-test-kotlin.yml
    with:
      runner-size: ${{ inputs.runner-size }}
      use-blacksmith-runners: ${{ inputs.use-blacksmith-runners }}
      use-arc-runners: ${{ inputs.use-arc-runners }}
      service-name: ${{ inputs.service-name }}
      service-emoji: ${{ inputs.service-emoji }}
      gradle-module: ${{ inputs.gradle-module }}
      java-version: ${{ inputs.java-version }}
      gradle-args: ${{ inputs.gradle-args }}
    secrets:
      GHL_USERNAME: ${{ secrets.GHL_USERNAME }}
      GHL_PASSWORD: ${{ secrets.GHL_PASSWORD }}
  build:
    name: Build
    uses: ./.github/workflows/component-build.yml
    with:
      runner-size: ${{ inputs.runner-size }}
      use-blacksmith-runners: ${{ inputs.use-blacksmith-runners }}
      use-arc-runners: ${{ inputs.use-arc-runners }}
      stage: ${{ inputs.stage }}
      service-name: ${{ inputs.service-name }}
      service-emoji: ${{ inputs.service-emoji }}
      service-identifier: ${{ inputs.service-identifier }}
      region: ${{ inputs.region }}
      docker-file-name: ${{ inputs.docker-file-name }}
      additional-build-args: ${{ inputs.additional-build-args }}
      ecr-repository-name: ${{ inputs.ecr-repository-name }}
      git-sha: ${{ inputs.git-sha }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      GHL_USERNAME: ${{ secrets.GHL_USERNAME }}
      GHL_PASSWORD: ${{ secrets.GHL_PASSWORD }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      AWS_CDN_ACCESS_KEY_ID: ${{ secrets.AWS_CDN_ACCESS_KEY_ID }}
      AWS_CDN_SECRET_ACCESS_KEY: ${{ secrets.AWS_CDN_SECRET_ACCESS_KEY }}
      LOKALISE_TOKEN: ${{ secrets.LOKALISE_TOKEN }}
      LOKALISE_PROJECT_ID: ${{ secrets.LOKALISE_PROJECT_ID }}
      GH_ACTION_ACCESS_KEY_ID: ${{ secrets.GH_ACTION_ACCESS_KEY_ID }}
      GH_ACTION_SECRET_ACCESS_KEY: ${{ secrets.GH_ACTION_SECRET_ACCESS_KEY }}
  deploy:
    name: Deploy
    needs:
      - test
      - build
    if: always() && (!inputs.run-tests || needs.test.result == 'success') && needs.build.result == 'success'
    uses: ./.github/workflows/component-deploy-v2.yml
    with:
      service-name: ${{ inputs.service-name }}
      service-emoji: ${{ inputs.service-emoji }}
      service-identifier: ${{ inputs.service-identifier }}
      stage: ${{ inputs.stage }}
      image-tag: ${{ needs.build.outputs.image-tag }}
      helm-values-path: ${{ inputs.helm-values-path }}
      repository-name: ${{ inputs.repository-name }}
      argocd-server: ${{ inputs.argocd-server }}
      argocd-app-name: ${{ inputs.argocd-app-name }}
      argocd-sync-wait-seconds: ${{ inputs.argocd-sync-wait-seconds }}
      wait-for-argocd-sync: ${{ inputs.wait-for-argocd-sync }}
    secrets:
      MANIFEST_REPO_PAT: ${{ secrets.MANIFEST_REPO_PAT }}
      ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
  update-service-profile:
    name: Update Service Profile
    needs: deploy
    if: always() && inputs.update-service-profile && needs.deploy.result == 'success'
    uses: ./.github/workflows/component-service-profile-kotlin.yml
    with:
      service-identifier: ${{ inputs.service-identifier }}
      stage: ${{ inputs.stage }}
      gradle-module: ${{ inputs.gradle-module }}
      java-version: ${{ inputs.java-version }}
      openapi-max-workers: ${{ inputs.openapi-max-workers }}
    secrets:
        GHL_USERNAME: ${{ secrets.GHL_USERNAME }}
        GHL_PASSWORD: ${{ secrets.GHL_PASSWORD }}
        MANIFEST_REPO_PAT: ${{ secrets.MANIFEST_REPO_PAT }}
  create-release-tag:
    name: Create Release Tag
    if: always() && inputs.enable-release-tag && needs.deploy.result == 'success'
    needs: deploy
    uses: ./.github/workflows/create-release-tag.yml
    with:
      prefix: ${{ inputs.release-tag-prefix }}
  create-changelog:
    name: Create and Publish Changelog
    needs: [create-release-tag, deploy]
    if: always() && inputs.enable-changelog && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
    steps:
      # The identity service that maps GitHub logins to Slack users is VPN-only, so the
      # runner joins the tailnet first. Only needed when a release notification is enabled
      # and an identity URL is configured. Best-effort: a failure here must never fail the
      # changelog job, the CLI falls back to less reliable email lookups instead.
      - name: Tailscale
        id: tailscale
        if: ${{ inputs.changelog-release-notify-channel != '' && vars.CHANGELOG_IDENTITY_RESOLVE_URL != '' && env.TAILSCALE_AUTHKEY != '' }}
        continue-on-error: true
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}
          hostname: "github-changelog-${{ github.run_id }}"
          # v4 passes --accept-routes itself; repeating it in args fails `tailscale up`
          args: "--login-server https://headscale.monta.com"
      # `tailscale up` returns before routes are usable, so the first request can hit a
      # half-open path. Poll the identity service until it answers, otherwise the CLI's
      # single best-effort lookup could silently fall back to GitHub profile emails.
      # Output stays quiet on purpose: the URL is an internal hostname.
      - name: Wait for the identity service to be reachable over the tailnet
        if: ${{ steps.tailscale.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          IDENTITY_RESOLVE_URL: ${{ vars.CHANGELOG_IDENTITY_RESOLVE_URL }}
        run: |
          MAX_ATTEMPTS=8
          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            if curl --silent --fail --connect-timeout 3 --max-time 5 \
                    --output /dev/null "${IDENTITY_RESOLVE_URL}?github=probe" 2>/dev/null; then
              echo "✅ Identity service reachable (attempt ${attempt}/${MAX_ATTEMPTS})"
              exit 0
            fi
            echo "… attempt ${attempt}/${MAX_ATTEMPTS} missed; retrying in 3s"
            sleep 3
          done
          echo "⚠️ Identity service not reachable; contributors may fall back to GitHub profile emails"
      - name: Run changelog cli action
        uses: monta-app/changelog-cli-action@main
        with:
          service-name: ${{ inputs.service-name }}
          github-release: true
          github-token: ${{ secrets.CHANGELOG_GITHUB_TOKEN }}
          github-tag-pattern: ${{ inputs.changelog-tag-pattern }}
          github-path-exclude-pattern: ${{ inputs.changelog-path-exclude-pattern }}
          jira-app-name: "montaapp"
          jira-email: ${{ secrets.JIRA_EMAIL }}
          jira-token: ${{ secrets.JIRA_TOKEN }}
          output: "slack"
          slack-token: ${{ secrets.SLACK_APP_TOKEN }}
          # Slack channel: C02PDBL6GAU = #info-releases
          slack-channel: "C02PDBL6GAU"
          stage: ${{ needs.deploy.outputs.stage }}
          docker-image: ${{ needs.deploy.outputs.docker-image }}
          image-tag: ${{ needs.deploy.outputs.image-tag }}
          previous-image-tag: ${{ needs.deploy.outputs.previous-image-tag }}
          deployment-start-time: ${{ needs.deploy.outputs.deployment-start-time }}
          deployment-end-time: ${{ needs.deploy.outputs.deployment-end-time }}
          deployment-url: ${{ needs.deploy.outputs.deployment-url }}
          comment-on-prs: ${{ inputs.comment-on-prs }}
          comment-on-jira: ${{ inputs.comment-on-jira }}
          jira-project-blacklist: ${{ vars.CHANGELOG_JIRA_PROJECT_BLACKLIST }}
          monitoring-urls: ${{ inputs.changelog-monitoring-urls }}
          release-notify-channel: ${{ inputs.changelog-release-notify-channel }}
          identity-resolve-url: ${{ vars.CHANGELOG_IDENTITY_RESOLVE_URL }}
