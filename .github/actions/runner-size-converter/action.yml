name: 'Runner Size Converter'
description: 'Convert a runner size into an arm64 GitHub runner name'
author: 'Your Organization'

inputs:
  runner-size:
    description: 'Runner size (normal or large)'
    required: true
  use-arc-runners:
    description: 'Run on the self-hosted ARC arm64 runners (private repositories only). Otherwise the GitHub-hosted linux-arm64 runners are used'
    required: false
    default: 'false'

outputs:
  runner-name:
    description: 'The converted runner name'
    value: ${{ steps.convert.outputs.runner-name }}

runs:
  using: 'composite'
  steps:
    - name: Convert runner size to runner name
      id: convert
      shell: bash
      run: |
        SIZE="${{ inputs.runner-size }}"
        USE_ARC="${{ inputs.use-arc-runners }}"
        PRIVATE="${{ github.event.repository.private }}"

        # Validate size
        case "$SIZE" in
          "normal"|"large")
            ;;
          *)
            echo "Error: Invalid runner size '$SIZE'. Must be 'normal' or 'large'"
            exit 1
            ;;
        esac

        # Resolve the runner name (arm64 only)
        if [ "$PRIVATE" = "false" ]; then
          RUNNER_NAME="ubuntu-24.04-arm"
        elif [ "$USE_ARC" = "true" ] && [ "$PRIVATE" = "true" ]; then
          # Self-hosted ARC runners on the internal EKS cluster
          if [ "$SIZE" = "large" ]; then
            RUNNER_NAME="arc-arm64-8cpu-24gb"
          else
            RUNNER_NAME="arc-arm64-4cpu-12gb"
          fi
        else
          # GitHub-hosted arm64 larger runners
          RUNNER_NAME="linux-arm64"
          if [ "$SIZE" = "large" ]; then
            RUNNER_NAME="$RUNNER_NAME-xl"
          fi
        fi

        echo "runner-name=$RUNNER_NAME" >> $GITHUB_OUTPUT
        echo "Selected runner: $RUNNER_NAME"
