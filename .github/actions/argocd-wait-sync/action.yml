name: 'ArgoCD Wait for Sync'
description: 'Wait for ArgoCD application to sync and become healthy'
author: 'Monta'

inputs:
  server:
    description: 'ArgoCD server URL (e.g., argocd.example.com)'
    required: true
  app-name:
    description: 'ArgoCD application name'
    required: true
  auth-token:
    description: 'ArgoCD authentication token'
    required: true
  timeout:
    description: 'Timeout duration in seconds to wait for ArgoCD sync to apply'
    required: false
    type: number
    default: 300
  revision:
    description: 'Expected git revision/commit SHA to verify deployment'
    required: true
  namespace:
    description: 'ArgoCD namespace where Application resource is stored (for UI URL construction)'
    required: false
    default: 'argocd'
  manifest-repo:
    description: 'GitHub repository containing ArgoCD manifests (e.g., owner/repo-name) for supersede detection'
    required: false
    default: 'monta-app/kube-manifests'
  github-token:
    description: 'GitHub token for API access (required for supersede detection)'
    required: true
  resource-name:
    description: >-
      Opt-in: name of a specific resource in the app's resource tree to track (e.g. a
      single Kubernetes Deployment in an app that manages several). When set, completion
      and fail-fast are judged on this resource's health instead of the app's aggregate
      health, so unrelated resources in the same app being broken or still progressing
      won't block or falsely pass this action. Leave empty to track the app as a whole
      (previous behavior).
    required: false
    default: ''
  resource-kind:
    description: 'Kind of the tracked resource. Only used when resource-name is set.'
    required: false
    default: 'Deployment'
  resource-namespace:
    description: >-
      Namespace of the tracked resource, to disambiguate same-named resources across
      namespaces. Only used when resource-name is set.
    required: false
    default: ''

outputs:
  deployment-start-time:
    description: 'ISO 8601 timestamp when ArgoCD started the sync operation (from ArgoCD operationState)'
    value: ${{ steps.wait-sync.outputs.deployment-start-time }}
  deployment-end-time:
    description: 'ISO 8601 timestamp when health status changed to Healthy (captured via real-time monitoring)'
    value: ${{ steps.wait-sync.outputs.deployment-end-time }}
  deployment-url:
    description: 'Direct URL to the application in ArgoCD UI'
    value: https://${{ inputs.server }}/applications/${{ inputs.namespace }}/${{ inputs.app-name }}

runs:
  using: 'composite'
  steps:
    - name: Install ArgoCD CLI
      shell: bash
      run: |
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64)  ARGOCD_ARCH="amd64" ;;
          aarch64) ARGOCD_ARCH="arm64" ;;
          *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
        esac
        echo "Installing ArgoCD CLI for $ARGOCD_ARCH..."
        curl -sSL -o argocd "https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-${ARGOCD_ARCH}"
        sudo install -m 755 argocd /usr/local/bin/argocd
        rm argocd
        argocd version --client

    - name: Wait for ArgoCD sync and monitor health transition
      id: wait-sync
      shell: bash
      env:
        ARGOCD_SERVER: ${{ inputs.server }}
        ARGOCD_AUTH_TOKEN: ${{ inputs.auth-token }}
        APP_NAME: ${{ inputs.app-name }}
        EXPECTED_REVISION: ${{ inputs.revision }}
        TIMEOUT: ${{ inputs.timeout }}
        MANIFEST_REPO: ${{ inputs.manifest-repo }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        RESOURCE_NAME: ${{ inputs.resource-name }}
        RESOURCE_KIND: ${{ inputs.resource-kind }}
        RESOURCE_NAMESPACE: ${{ inputs.resource-namespace }}
      run: |
        # Run the shared wait-sync script
        "${{ github.action_path }}/wait-sync.sh"
