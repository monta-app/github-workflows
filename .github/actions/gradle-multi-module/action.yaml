name: 'Gradle Multi-Module Command Runner'
description: 'Runs Gradle tasks with conditional module-specific targeting'
inputs:
  gradle-module:
    description: 'Name of the gradle module (optional for root project)'
    required: false
  gradle-tasks:
    description: 'Space-separated list of Gradle tasks to run'
    required: true
  gradle-args:
    description: 'Additional Gradle arguments'
    required: false
    default: '--no-daemon --parallel'
runs:
  using: 'composite'
  steps:
    - name: Run Gradle tasks
      shell: bash
      env:
        GRADLE_MODULE: ${{ inputs.gradle-module }}
        GRADLE_TASKS: ${{ inputs.gradle-tasks }}
        GRADLE_ARGS: ${{ inputs.gradle-args }}
      run: |
        # GRADLE_ARGS and GRADLE_TASKS are space-separated lists: left unquoted on purpose so they word-split
        if [ -z "$GRADLE_MODULE" ]; then
          # For root project (no module specified)
          echo "Running command: ./gradlew $GRADLE_ARGS $GRADLE_TASKS"
          # shellcheck disable=SC2086
          ./gradlew $GRADLE_ARGS $GRADLE_TASKS
        else
          # For specific module - prefix each task with module name
          PREFIXED_TASKS=""
          for task in $GRADLE_TASKS; do
            PREFIXED_TASKS="$PREFIXED_TASKS $GRADLE_MODULE:$task"
          done
          echo "Running command: ./gradlew $GRADLE_ARGS $PREFIXED_TASKS"
          # shellcheck disable=SC2086
          ./gradlew $GRADLE_ARGS $PREFIXED_TASKS
        fi
