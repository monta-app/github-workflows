name: Automation token
description: >-
  Gets a one-hour token of the Monta Automation GitHub App for one repo, from octo-guardrail's token broker, in
  exchange for this job's GitHub Actions OIDC token. Monta Automation is no ruleset bypass actor: a `pr` token
  pushes branches and opens pull requests that go through the repo's rules and, unlike GITHUB_TOKEN, trigger its
  workflows; a `read` token reads another private repo (a git dependency, a release asset). Only the workflows in
  octo-guardrail's AUTOMATION_WORKFLOWS get one (see its README, "Automation tokens"). While the rollout lasts it
  falls back to fallback-token when the broker can't be reached or refuses, with a warning. The job needs
  `permissions: id-token: write` (the default token doesn't include it).

inputs:
  repository:
    description: 'Repo the token is for: a name in monta-app, without the owner (e.g. test-visibility).'
    required: true
  permissions:
    description: '"pr" (contents and pull_requests write) or "read" (contents read).'
    required: true
  fallback-token:
    description: 'Token to use when no Automation token can be had. Empty: fail instead.'
    required: false
    default: ''
  broker-url:
    description: >-
      octo-guardrail's backend, reachable from the ARC runners in the internal cluster: pass the org variable
      DEPLOY_TOKEN_BROKER_URL (the same backend serves deploy and automation tokens). This repo is public, so
      the in-cluster address stays out of it. Empty: use fallback-token.
    required: false
    default: ''
  audience:
    description: 'OIDC audience octo-guardrail expects (AUTOMATION_OIDC_AUDIENCE).'
    required: false
    default: 'octo-guardrail-automation'

outputs:
  token:
    description: 'The token (masked).'
    value: ${{ steps.token.outputs.token }}
  source:
    description: '"automation" for a Monta Automation token, "fallback" for fallback-token.'
    value: ${{ steps.token.outputs.source }}
  git-user-name:
    description: 'Commit author name that matches the token.'
    value: ${{ steps.token.outputs.git-user-name }}
  git-user-email:
    description: 'Commit author email that matches the token.'
    value: ${{ steps.token.outputs.git-user-email }}

runs:
  using: composite
  steps:
    - name: Get automation token
      id: token
      shell: bash
      env:
        TARGET: ${{ inputs.repository }}
        SCOPE: ${{ inputs.permissions }}
        FALLBACK: ${{ inputs.fallback-token }}
        BROKER: ${{ inputs.broker-url }}
        AUDIENCE: ${{ inputs.audience }}
      run: |
        set -uo pipefail
        if [[ ! "$TARGET" =~ ^[A-Za-z0-9._-]{1,100}$ ]]; then
          echo "::error::repository must be a repo name without the owner, got '$TARGET'"
          exit 1
        fi
        if [[ "$SCOPE" != "pr" && "$SCOPE" != "read" ]]; then
          echo "::error::permissions must be pr or read, got '$SCOPE'"
          exit 1
        fi

        token="" reason=""
        BROKER="${BROKER%/}"
        if [ -z "$BROKER" ]; then
          reason="no broker URL (pass the org variable DEPLOY_TOKEN_BROKER_URL)"
        elif [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          reason="the job has no id-token: write permission"
        else
          oidc=$(curl -fsS --max-time 10 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r '.value // empty') || oidc=""
          if [ -z "$oidc" ]; then
            reason="GitHub didn't issue an OIDC token"
          else
            echo "::add-mask::$oidc"
            body=$(mktemp)
            code=$(curl -sS --max-time 20 -o "$body" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' \
              -d "$(jq -cn --arg r "$TARGET" --arg p "$SCOPE" '{repository: $r, permissions: $p}')" \
              "$BROKER/api/public/automation-token") || code="000"
            if [ "$code" = "200" ]; then
              token=$(jq -r '.token // empty' "$body")
              [ -n "$token" ] || reason="the broker answered 200 without a token"
            elif [ "$code" = "000" ]; then
              reason="couldn't reach the broker at $BROKER"
            else
              # Error bodies carry only a message (which workflow, repo or set isn't allowed), never a token.
              reason="the broker answered $code: $(jq -r '.error // empty' "$body" 2>/dev/null | head -c 300)"
            fi
            rm -f "$body"
          fi
        fi

        if [ -n "$token" ]; then
          echo "::add-mask::$token"
          {
            echo "token=$token"
            echo "source=automation"
            echo "git-user-name=monta-automation[bot]"
            echo "git-user-email=361708839+monta-automation[bot]@users.noreply.github.com"
          } >> "$GITHUB_OUTPUT"
          echo "Using a Monta Automation $SCOPE token for monta-app/$TARGET"
        elif [ -n "$FALLBACK" ]; then
          echo "::warning::No Monta Automation $SCOPE token for monta-app/$TARGET ($reason); using the fallback token."
          {
            echo "token=$FALLBACK"
            echo "source=fallback"
            echo "git-user-name=GitHub Action"
            echo "git-user-email=action@github.com"
          } >> "$GITHUB_OUTPUT"
        else
          echo "::error::No Monta Automation $SCOPE token for monta-app/$TARGET ($reason) and no fallback-token."
          exit 1
        fi
