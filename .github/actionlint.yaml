# actionlint configuration
# https://github.com/rhysd/actionlint/blob/main/docs/config.md

self-hosted-runner:
  # Define custom self-hosted runner labels
  labels:
    - linux-arm64
    - linux-arm64-xl
    - self-hosted-arm64
    - self-hosted-arm64-2xl
    - arc-arm64-1cpu-2gb-nodocker
    - arc-arm64-2cpu-4gb
    - arc-arm64-4cpu-12gb
    - arc-arm64-8cpu-24gb

paths:
  .github/workflows/zizmor.yml:
    ignore:
      # actionlint 1.7.12 doesn't know job.workflow_sha yet.
      - 'property "workflow_sha" is not defined in object type'
